<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A股板块恐贪温度计</title>
<style>
  :root{
    /* 面：整体压暗（2026-10-07 改版），折线反向加亮，保证图上对比度 */
    --bg:#05070B; --card:#0A0E14; --card2:#10161F; --card3:#161E29;
    --bd:rgba(148,171,200,.09); --bd2:rgba(148,171,200,.18); --bd3:rgba(148,171,200,.28);
    --tx:#E9EFF8; --mut:#9AABBF; --dim:#71809A;
    /* 语义色：红涨绿跌（A 股口径，勿改） */
    --red:#FF5C5C; --grn:#3ECF8E; --blu:#63B3FF; --yel:#F5B544;
    --pur:#C9A2FF; --org:#FFB86B; --cyn:#4FD1E8;
    --r:14px; --r2:11px; --r3:8px;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--tx);
       font-family:"Inter","Inter var",-apple-system,"Segoe UI",Roboto,
                   "PingFang SC","Microsoft YaHei",sans-serif;
       font-size:14px;line-height:1.55;padding:0 0 20px;
       font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1560px;margin:0 auto;padding:0 20px}
  ::selection{background:rgba(99,179,255,.26);color:#fff}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:#1A2230;border-radius:6px;border:2px solid var(--bg)}

  /* ---------- header ---------- */
  header{display:flex;justify-content:space-between;align-items:center;gap:18px;
         flex-wrap:wrap;padding:14px 0 10px}
  .title{font-size:20px;font-weight:650;letter-spacing:-.2px;color:#F2F6FB;white-space:nowrap}
  .title span{color:var(--blu)}
  .hmeta{color:var(--dim);font-size:12px;text-align:right;line-height:1.7}
  .hmeta b{color:var(--mut);font-weight:600}

  /* 大机会 / 小机会：分段控件 */
  .seg{display:inline-flex;background:var(--card2);border:1px solid var(--bd);
       border-radius:9px;padding:3px;margin-left:14px;vertical-align:2px}
  .seg button{border:0;background:none;color:var(--mut);font:inherit;font-size:13px;
       padding:5px 14px;border-radius:6px;cursor:pointer;white-space:nowrap;
       transition:.16s var(--ease)}
  .seg button small{color:var(--dim);font-size:11.5px}
  .seg button.on{background:rgba(99,179,255,.16);color:#DCEBFF;font-weight:600;
       box-shadow:inset 0 0 0 1px rgba(99,179,255,.38)}
  .seg button:focus-visible{outline:2px solid var(--blu);outline-offset:2px}

  /* ---------- 今日结论横幅 ---------- */
  .banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
       background:var(--card);border:1px solid var(--bd);
       border-left:3px solid var(--dim);border-radius:10px;
       padding:9px 16px;font-size:14px;margin-bottom:11px}
  .banner.hot{border-color:rgba(62,207,142,.30);border-left-color:#6FE39C}
  .banner b{color:#6FE39C;font-weight:650}
  .banner .gr{font-weight:650}
  .banner .more{margin-left:auto;color:var(--dim);font-size:12px}

  /* ---------- 6 板块卡 ---------- */
  .boards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:11px}
  .bd{background:var(--card);border:1px solid var(--bd);border-radius:12px;
      padding:11px 13px 9px;cursor:pointer;min-width:0;
      transition:border-color .16s var(--ease),background .16s var(--ease)}
  .bd:hover{border-color:var(--bd2);background:var(--card2)}
  .bd.sel{border-color:rgba(99,179,255,.5);background:#0C1219}
  .bd.sig{border-color:rgba(111,227,156,.5)}
  .bd .hd{display:flex;align-items:center;gap:7px;margin-bottom:7px;min-height:20px}
  .bd .nm{font-size:13.5px;font-weight:600;white-space:nowrap}
  .bd .gb{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;
      margin-left:auto;white-space:nowrap;color:#04222B}
  .bd .row{display:flex;align-items:center;gap:7px;padding:2.5px 0;font-size:12px}
  .bd .row .rn{width:52px;color:var(--dim);flex:none;white-space:nowrap}
  .bd .row .rv{width:26px;font-weight:650;font-size:13.5px;text-align:right;flex:none}
  .bd .row .tr{flex:1;height:5px;border-radius:99px;background:#171E29;position:relative;min-width:20px}
  .bd .row .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
  .bd .row .tr u{position:absolute;top:-2.5px;width:2px;height:10px;background:rgba(233,239,248,.55)}
  .bd .row .hit{font-size:10.5px;color:#6FE39C;font-weight:700;width:30px;flex:none;white-space:nowrap}
  /* 大机会模式：单值卡片 */
  .bd .one{display:flex;align-items:baseline;gap:8px;padding:2px 0 4px}
  .bd .one .ov{font-size:30px;font-weight:650;letter-spacing:-1px;line-height:1.1}
  .bd .one .os{font-size:12.5px;font-weight:600}
  /* 盘中预览（点过「盘中刷新」才出现；只是预览，不是信号） */
  .banrow{display:flex;gap:10px;align-items:stretch;margin-bottom:11px}
  .banrow .banner{flex:1;margin-bottom:0;min-width:0}
  #intrabtn{border:1px solid var(--bd);background:var(--card2);color:var(--mut);
      font:inherit;font-size:12.5px;padding:0 16px;border-radius:10px;cursor:pointer;
      white-space:nowrap;transition:.16s var(--ease)}
  #intrabtn:hover{color:var(--tx);border-color:var(--bd2)}
  #intrabtn:disabled{opacity:.55;cursor:default}
  .bd .intr{margin-top:5px;padding-top:5px;border-top:1px dashed var(--bd);
      font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .bd .intr b{font-weight:650;font-size:12.5px}

  /* ---------- 图区 ---------- */
  .chartcard{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);
      padding:11px 16px 6px}
  .chead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
      padding-bottom:8px;border-bottom:1px solid var(--bd);margin-bottom:6px}
  .ctitle{font-size:15px;font-weight:650;letter-spacing:-.1px;color:#F2F6FB}
  .ctitle small{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px}
  .mtabs{display:flex;gap:4px;background:var(--card2);border:1px solid var(--bd);
      border-radius:9px;padding:3px}
  .mtabs button{border:0;background:none;color:var(--mut);font:inherit;font-size:12.5px;
      padding:5px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;
      transition:.16s var(--ease)}
  .mtabs button i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
  .mtabs button.on{background:rgba(99,179,255,.16);color:#DCEBFF;font-weight:600;
      box-shadow:inset 0 0 0 1px rgba(99,179,255,.38)}
  .rng{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
  .rng button{border:0;background:none;color:var(--dim);font:inherit;font-size:12px;
      padding:4px 9px;border-radius:6px;cursor:pointer;transition:.16s var(--ease)}
  .rng button:hover{color:var(--tx)}
  .rng button.on{background:var(--card3);color:var(--tx);font-weight:600}
  #plot{width:100%;border-radius:10px;margin-top:2px}

  .cfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--mut);
      font-size:12px;padding:8px 0 4px}
  .cfoot > span,.cfoot > label{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;
      background:rgba(148,171,200,.05);border:1px solid var(--bd);border-radius:999px;
      line-height:1.6;cursor:default}
  .cfoot > label{cursor:pointer;user-select:none}
  .cfoot i{display:inline-block;width:12px;height:3px;border-radius:2px;flex:none}
  .cfoot input{accent-color:var(--blu);width:12px;height:12px;margin:0}
  #modestat{color:var(--mut)}
  #modestat b{color:var(--tx)}
  #rnginfo{color:var(--dim)}

  /* 合并视图：三个模型各自一张图（禁止改回三条线叠一张图，见 DELIVERY.md §17） */
  .subchart{border:1px solid var(--bd);border-radius:var(--r2);
            background:rgba(148,171,200,.022);padding:10px 12px 4px;margin-bottom:12px}
  .subchart:last-child{margin-bottom:0}
  .schead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
          font-size:12px;color:var(--mut);padding:0 2px 6px}
  .schead b{font-size:13px;font-weight:600}
  .sdot{width:8px;height:8px;border-radius:50%;flex:none;align-self:center}
  .shint{color:var(--dim)}
  .sval{margin-left:auto;color:var(--mut);white-space:nowrap}
  .sval b{font-size:13px}

  /* 大白话说明（折叠） */
  .gnote{margin-top:10px;background:var(--card2);border:1px solid var(--bd);
         border-radius:var(--r2);overflow:hidden}
  .gnote summary{cursor:pointer;padding:9px 14px;font-size:12.5px;color:var(--tx);
         font-weight:600;list-style:none;display:flex;align-items:center;gap:9px;user-select:none;
         transition:background .16s var(--ease)}
  .gnote summary:hover{background:var(--card3)}
  .gnote summary::-webkit-details-marker{display:none}
  .gnote summary::before{content:"";width:5px;height:5px;border-radius:50%;
         background:var(--yel);flex:none;box-shadow:0 0 0 3px rgba(245,181,68,.16)}
  .gnote summary::after{content:"▾";margin-left:auto;color:var(--dim);font-size:12px;
         transition:transform .2s var(--ease)}
  .gnote[open] summary::after{transform:rotate(180deg)}
  .gbody{padding:11px 14px 13px;font-size:12.5px;color:var(--mut);line-height:1.9;
         border-top:1px solid var(--bd)}
  .gbody b.k{color:var(--tx);font-weight:600}

  .footstrip{display:flex;justify-content:space-between;gap:14px;color:var(--dim);
      font-size:12px;padding:11px 2px 0;flex-wrap:wrap}
  .footstrip b{color:var(--mut);font-weight:600}

  #tip{position:fixed;pointer-events:none;background:rgba(8,12,18,.97);border:1px solid var(--bd2);
       border-radius:12px;padding:11px 14px;font-size:12px;display:none;z-index:99;
       box-shadow:0 16px 40px -16px rgba(0,0,0,.9);white-space:nowrap;line-height:1.85;
       backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

  @media(max-width:1200px){ .boards{grid-template-columns:repeat(3,1fr)} }
  @media(max-width:640px){
    .wrap{padding:0 12px}
    .boards{grid-template-columns:repeat(2,1fr)}
    .hmeta{text-align:left}
  }
  @media(prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <span class="title">A股板块<span>恐贪温度计</span></span>
      <span class="seg" id="modeseg"></span>
    </div>
    <div class="hmeta">数据更新至 <b>{{ meta.last_date }}</b>（每天收盘后更新 · 生成于 {{ meta.built_at }}）<br>
      这个页面回答一个问题：<b>现在哪里跌过头了？</b></div>
  </header>

  <div class="banrow">
    <div class="banner" id="banner"></div>
    <button id="intrabtn" title="用实时快照算一遍：假设现在就收盘，各板块温度是多少（只是预览，不是提示）">盘中刷新</button>
  </div>
  <div class="boards" id="boards"></div>

  <div class="chartcard">
    <div class="chead">
      <div class="ctitle" id="ctitle">温度走势</div>
      <div class="mtabs" id="mtabs"></div>
      <div class="rng" id="rng"></div>
    </div>
    <div id="plot"></div>
    <div class="cfoot">
      <label><input type="checkbox" id="ovl" checked> 叠加指数走势（灰线）</label>
      <span id="rnginfo"></span>
      <span id="modestat"></span>
    </div>
    <div class="cfoot" id="legend" style="padding-top:0"></div>
    <details class="gnote">
      <summary id="gsum">看不懂？点这里，大白话解释这个页面</summary>
      <div class="gbody" id="gbody"></div>
    </details>
  </div>

  <div class="footstrip" id="footstrip"></div>
</div>
<div id="tip"></div>

<script>
const DATA = {{ payload|tojson }};
const SUM  = {{ summary|tojson }};
const KEYS = {{ boards|tojson }};
const HOLD = {{ hold }};
const META = {start:'{{ meta.start }}', last_date:'{{ meta.last_date }}', built_at:'{{ meta.built_at }}'};
let cur = KEYS[0].key;

/* ---------- 模式与视图 ----------
   MODE: senti=大机会（SENTI-1 大波段） / swing=小机会（三个小波段模型）
   SRC : union=三个一起看（默认，不丢信号） / swing=跌得深 / swing2=跌势放缓 / swing3=均线止跌 */
let MODE = 'swing';
let SRC  = 'union';
const MODES = [
  {k:'swing', n:'小机会', s:'一年几十次 · 抓回调'},
  {k:'senti', n:'大机会', s:'一年几次 · 抓大底'},
];
const MTABS = [
  {k:'union',  n:'三个一起看', c:'#F5B544', hint:'三个模型各一张图，刻度不同，各自跟自己比'},
  {k:'swing',  n:'跌得深',    c:'#63B3FF', hint:'看「跌到哪了」：价格离近期高点和各条均线有多远'},
  {k:'swing2', n:'跌势放缓',  c:'#C9A2FF', hint:'看「跌得还有多快」：下跌的劲正在衰竭，哪怕价格还在跌'},
  {k:'swing3', n:'均线止跌',  c:'#FFB86B', hint:'看「均线还跌得多急」：跌到极急、且当天已经开始放缓'},
];
const SW  = () => SUM.swing  || {thr:22, hold:7, cool:4, tol:3};
const SRC2= () => SUM.swing2 || {thr:12, hold:7, cool:4, tol:3};
const SRC3= () => SUM.swing3 || {thr:10, hold:7, cool:4, tol:3};

/* ---------- helpers ---------- */
const fmt=(n,d=2)=>(n===null||n===undefined||isNaN(n))?'--':Number(n).toFixed(d);
const lastOf=a=>(a&&a.length)?a[a.length-1]:null;
const $=id=>document.getElementById(id);

/* 状态词：大白话 */
function state(v){
  if(MODE==='swing'){
    const t=THR();
    if(v<=t)  return ['跌到位了 · 已出提示','#6FE39C'];
    if(v<30)  return ['很冷','#5FCE96'];
    if(v<45)  return ['偏凉','#7FB6FF'];
    if(v<60)  return ['正常','#96A5BA'];
    if(v<75)  return ['偏热','#F5B544'];
    return ['很热 · 短期涨得快','#FF5C5C'];
  }
  if(v<=(SUM.entry_thr??0)) return ['跌到位了 · 已出提示','#6FE39C'];
  if(v<0)   return ['极度恐慌 · 底部区','#3ECF8E'];
  if(v<20)  return ['恐慌','#5FCE96'];
  if(v<40)  return ['偏凉','#7FB6FF'];
  if(v<60)  return ['正常','#96A5BA'];
  if(v<80)  return ['偏热','#F5B544'];
  if(v<=100)return ['贪婪','#FF9A6B'];
  return ['极度贪婪 · 顶部区','#FF5C5C'];
}

/* 等级配色与大白话释义（全页统一口径） */
const GCOL={S:'#4FD1E8',A:'#6FE39C',B:'#F5B544',C:'#96A5BA'};
const GWHY={bottom:{A:'估值投降 + 多板块一起恐慌，证据最足',B:'两个确认只成立一个',C:'两个确认都没成立'}};
const GWHY2={S:'6 个板块里 5 个以上一起提示，最可信的一档',A:'当天 4 个板块一起提示',
             B:'当天 2~3 个板块一起提示',C:'只有这个板块提示'};
function gradeOf(e){
  if(MODE==='swing'){
    const r = SRC==='union' ? (e.ures||e.reso||1) : (e.reso||1);
    return r>=5?'S':(r>=4?'A':(r>=2?'B':'C')); }
  return e.grade||'C';
}
const whyOf=(e,g)=> MODE==='swing' ? (GWHY2[g]||'') : ((GWHY[e.kind]||{})[g]||'');

/* 当前视图取哪条曲线 / 哪些信号 / 阈值 / 持有期 */
const THR = () => MODE!=='swing' ? (SUM.entry_thr ?? 0)
               : (SRC==='swing2' ? SRC2().thr : (SRC==='swing3' ? SRC3().thr : SW().thr));
const HOLD2= () => MODE==='swing' ? SW().hold : HOLD;

/* ---------- header：模式分段控件 ---------- */
const segEl=$('modeseg');
segEl.innerHTML=MODES.map(m=>
  `<button data-k="${m.k}" class="${m.k===MODE?'on':''}">${m.n} <small>${m.s}</small></button>`).join('');
segEl.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  MODE=b.dataset.k;
  segEl.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.k===MODE));
  render();
});

/* ---------- 模型 Tab（小机会模式才显示） ---------- */
const mtabsEl=$('mtabs');
mtabsEl.innerHTML=MTABS.map(t=>
  `<button data-k="${t.k}" class="${t.k===SRC?'on':''}"><i style="background:${t.c}"></i>${t.n}</button>`).join('');
mtabsEl.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  SRC=b.dataset.k;
  mtabsEl.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.k===SRC));
  render();
});

/* ---------- 时间范围 ---------- */
const RANGES=[['7d','近7天',7],['1m','近1个月',30],['3m','近3个月',91],
              ['6m','近半年',182],['1y','近1年',365],['all','全部',null]];
let RNG='all';
const rngEl=$('rng');
rngEl.innerHTML=RANGES.map(([k,lab])=>
  `<button data-k="${k}" class="${k===RNG?'on':''}">${lab}</button>`).join('');
rngEl.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  RNG=b.dataset.k;
  rngEl.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.k===RNG));
  drawChart();
});

/* ---------- 今日结论横幅 ---------- */
function renderBanner(){
  const el=$('banner');
  const cold=[], fresh=[];
  KEYS.forEach(bk=>{
    const B=DATA[bk.key], d=B.dates[B.dates.length-1];
    let hit=false;
    if(MODE==='swing'){
      hit = (lastOf(B.swing)??99)<=SW().thr || (lastOf(B.swing2)??99)<=SRC2().thr
         || (lastOf(B.swing3)??99)<=SRC3().thr;
      const ev=(B.union_events||[]).find(e=>e.date===d);
      if(hit) cold.push(B.name);
      if(ev) fresh.push({name:B.name, g:gradeOf(ev), why:whyOf(ev,gradeOf(ev))});
    }else{
      hit = (lastOf(B.score)??99)<=(SUM.entry_thr??0);
      const ev=(B.bottom||[]).find(e=>e.date===d);
      if(hit) cold.push(B.name);
      if(ev){const g=ev.grade||'C'; fresh.push({name:B.name, g, why:whyOf(ev,g)});}
    }
  });
  const ORDER={S:0,A:1,B:2,C:3};
  fresh.sort((a,b)=>ORDER[a.g]-ORDER[b.g]);
  let html;
  if(!cold.length){
    html=`<span>今天扫描结果：6 个板块温度都在触发线以上，<b style="color:var(--mut)">没有「跌到位」的板块</b>，正常波动。</span>`;
  }else{
    html=`<span>今天扫描结果：<b>${cold.length} 个板块温度跌破触发线</b>（${cold.join('、')}）`;
    if(fresh.length){
      const f=fresh[0];
      html+=` ｜ 其中 ${f.name} 今天刚出 <span class="gr" style="color:${GCOL[f.g]}">${f.g} 级提示</span>——${f.why}`;
    }
    html+=`</span>`;
  }
  html+=`<span class="more">「跌到位」＝ 温度跌破触发线，历史上这种时候之后 ${MODE==='swing'?'7 天':'20~60 天'}上涨居多</span>`;
  el.innerHTML=html;
  el.classList.toggle('hot', cold.length>0);
}

/* ---------- 盘中预览（手动刷新；只是预览，不产生提示、不进统计） ----------
   INTRA = {ts, day, live, clickedDay, showUntil, boards:{...}}。
   showUntil：交易时段点击 = 当天 15:05（此前渲染都显示数值）；
             收盘后/节假日点击 = 0（一直显示「—」）。跨天自然过期。 */
let INTRA=null;
const todayStr=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')
                    +'-'+String(t.getDate()).padStart(2,'0');};
const intraBtn=$('intrabtn');
function intraCool(sec){          /* 冷却倒计时：按钮禁用并显示剩余秒数（与后端 60s 缓存同步） */
  let left=sec;
  const tick=()=>{
    if(left<=0){intraBtn.disabled=false;intraBtn.textContent='盘中刷新';return;}
    intraBtn.textContent='已刷新（'+left+'s 后可再刷）'; left--;
    setTimeout(tick,1000);
  };
  tick();
}
intraBtn.addEventListener('click',()=>{

                  setTimeout(()=>{intraBtn.disabled=false;intraBtn.textContent='盘中刷新';},3000);};
  intraBtn.disabled=true; intraBtn.textContent='快照计算中（约15秒）…';
  fetch('/api/intraday').then(r=>r.json()).then(j=>{

function renderBoards(){
  const el=$('boards');
  el.innerHTML=KEYS.map(bk=>{
    const B=DATA[bk.key], d=B.dates[B.dates.length-1];
    let rows='', badge='', sig=false;
    if(MODE==='swing'){
      const ev=(B.union_events||[]).find(e=>e.date===d);
      const defs=[['跌得深',B.swing,SW().thr,'#63B3FF'],
                  ['跌势放缓',B.swing2,SRC2().thr,'#C9A2FF'],
                  ['均线止跌',B.swing3,SRC3().thr,'#FFB86B']];
      const anyHit=defs.some(df=>{const v=lastOf(df[1]);return v!=null&&v<=df[2];});
      if(ev){const g=gradeOf(ev); sig=true;
        badge=`<span class="gb" style="background:${GCOL[g]}">${g} 级提示中</span>`;}
      else if(anyHit) badge=`<span class="gb" style="background:#2A3A4A;color:#9AABBF">已跌破</span>`;
      rows=defs.map(df=>{
        const v=lastOf(df[1]), hit=v!=null&&v<=df[2];
        const pct=v==null?0:Math.max(0,Math.min(100,v));
        return `<div class="row">
          <span class="rn">${df[0]}</span>
          <span class="rv" style="color:${df[3]}">${fmt(v,1)}</span>
          <span class="tr"><i style="width:${pct}%;background:${df[3]};opacity:.8"></i><u style="left:${Math.min(100,df[2])}%"></u></span>
          <span class="hit">${hit?'● 已达':''}</span>
        </div>`;}).join('');
    }else{
      const v=lastOf(B.score), T0=SUM.entry_thr??0;
      const [txt,col]=state(v);
      const ev=(B.bottom||[]).find(e=>e.date===d);
      const hit=v!=null&&v<=T0;
      if(ev){const g=ev.grade||'C'; sig=true;
        badge=`<span class="gb" style="background:${GCOL[g]}">${g} 级提示中</span>`;}
      else if(hit) badge=`<span class="gb" style="background:#2A3A4A;color:#9AABBF">已跌破</span>`;
      const pct=v==null?0:Math.max(0,Math.min(100,(v+30)/160*100));
      const tpct=Math.max(0,Math.min(100,(T0+30)/160*100));
      rows=`<div class="one"><span class="ov" style="color:${col}">${fmt(v,1)}</span>
              <span class="os" style="color:${col}">${txt}</span></div>
            <div class="row"><span class="rn">大机会</span>
              <span class="tr" style="flex:1"><i style="width:${pct}%;background:${col};opacity:.85"></i><u style="left:${tpct}%"></u></span>
              <span class="hit">${hit?'● 已达':''}</span></div>`;
    }
    /* 盘中预览区：常显。数值只在 showUntil 之前显示（= 交易时段点击后~当天15:05）；
       收盘后/节假日点击、跨天、未刷新 → 显示「—」 */
    const iv=(INTRA&&INTRA.boards&&INTRA.showUntil&&Date.now()<INTRA.showUntil)
      ?INTRA.boards[bk.key]:null;
    const v=iv||{};
    const pv=(x,c)=>x==null?'<b style="color:var(--dim)">—</b>':`<b style="color:${c}">${fmt(x,1)}</b>`;
    const ilab=iv?('盘中 '+INTRA.ts)
      :(INTRA&&INTRA.clickedDay===todayStr()?'盘中（已收盘）':'盘中（未刷新）');
    rows+= MODE==='swing'
      ? `<div class="intr"><span>${ilab}</span>${pv(v.swing,'#63B3FF')}<span>/</span>${pv(v.swing2,'#C9A2FF')}<span>/</span>${pv(v.swing3,'#FFB86B')}</div>`
      : `<div class="intr"><span>${ilab}</span>${pv(v.senti,'#7FB6FF')}</div>`;
    return `<div class="bd${bk.key===cur?' sel':''}${sig?' sig':''}" data-k="${bk.key}" title="${B.desc||''}">
      <div class="hd"><span class="nm">${B.name}</span>${badge}</div>${rows}</div>`;
  }).join('');
}
$('boards').addEventListener('click',e=>{
  const c=e.target.closest('.bd'); if(!c) return;
  cur=c.dataset.k; render();
});

/* ---------- chart ---------- */
let cvW=900;
function measure(){ cvW = $('plot').clientWidth || 900; }

function winIdx(B){
  const n=B.dates.length, i1=n-1;
  const r=RANGES.find(r=>r[0]===RNG);
  const days=r?r[2]:null;
  if(days==null) return [0,i1];
  const t=new Date(B.dates[i1]+'T00:00:00'); t.setDate(t.getDate()-days);
  const cut=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')
            +'-'+String(t.getDate()).padStart(2,'0');
  let i0=i1; while(i0>0 && B.dates[i0-1]>=cut) i0--;
  if(i1-i0<4) i0=Math.max(0,i1-4);
  return [i0,i1];
}

/* 信号点：S 青蓝双环 / A 带环实心 / B 实心 / C 空心，下面标字母（冒烟测试按 class 计数，勿改 class 名） */
function sigMarker(cx, cy, g){
  const col=GCOL[g]||GCOL.C; let s='';
  if(g==='S') s+=`<circle cx="${cx}" cy="${cy}" r="11.5" fill="none" stroke="${col}" stroke-width="1.1" opacity=".5"/>`;
  if(g==='S'||g==='A') s+=`<circle class="halo" cx="${cx}" cy="${cy}" r="8.5" fill="none" stroke="${col}" stroke-width="1.3" opacity=".95"/>`;
  const fill=g==='C'?'none':col;
  s+=`<path class="sigmk" d="M${cx} ${(cy-7).toFixed(1)} l-6.5 11 l13 0 Z" fill="${fill}" stroke="${col}" stroke-width="1.5" stroke-linejoin="round"/>`;
  s+=`<text x="${cx}" y="${(cy+23).toFixed(1)}" fill="${col}" font-size="10.5" font-weight="700" text-anchor="middle">${g}</text>`;
  return s;
}

/* ---------- 合并视图：三个模型各一张图 ----------
   为什么不叠在一张图（2026-09-23）：三者都标 0~100 但刻度中心不同
   （近 750 日中位数 58~70 / 44~51 / 34~49），叠一起会误读成「均线止跌特别超卖」。
   分开画后每张图只跟自己比：自己的曲线 + 自己的触发线 + 自己的信号点。 */
const SUB3=[
  {key:'swing',  name:'跌得深',  color:'#63B3FF',
   hint:'看「跌到哪了」——价格离近期高点与各条均线有多远', srcs:['swing','both']},
  {key:'swing2', name:'跌势放缓', color:'#C9A2FF',
   hint:'看「跌得还有多快」——下跌的劲正在衰竭', srcs:['macd','both']},
  {key:'swing3', name:'均线止跌', color:'#FFB86B',
   hint:'看「均线还跌得多急」——跌到极急且当天已放缓', srcs:['maslope','both']},
];
let GEOS=[];

function bindHover(svg,g){
  svg.addEventListener('mousemove',ev=>{
    const r=svg.getBoundingClientRect();
    const px=(ev.clientX-r.left)/r.width*g.W;
    let i=Math.round((px-g.L)/(g.PW/(g.N-1)));
    i=Math.max(0,Math.min(g.N-1,i));
    const hx=g.x(g.i0+i);
    const hv=svg.querySelector('.hoverline'), hd=svg.querySelector('.hoverdot');
    if(hv){hv.setAttribute('x',hx);hv.style.display='';}
    if(hd){hd.setAttribute('cx',hx);hd.setAttribute('cy',g.y(g.sc[i]));hd.style.display='';}
    const tip=$('tip');
    tip.style.display='block';tip.style.left=(ev.clientX+14)+'px';tip.style.top=(ev.clientY-10)+'px';
    const evs2=g.evmap[g.dates[i]]||[];
    const evTxt=evs2.map(e=>{
      const gg=gradeOf(e);
      const rr=(e.ret!=null?`　之后 ${g.hold||7} 天 ${e.ret>0?'+':''}${fmt(e.ret)}%`:'　之后 7 天 待验证');
      const stag=(e.src==='macd'?'<span style="color:#C9A2FF">◆跌势放缓</span> '
        :e.src==='maslope'?'<span style="color:#FFB86B">●均线止跌</span> '
        :e.src==='swing'?'<span style="color:#63B3FF">▲跌得深</span> '
        :'<span style="color:#F5B544">多个模型同时</span> ');
      return `<div style="margin-top:4px">${stag}<b style="color:${GCOL[gg]}">${gg} 级提示</b>`
             +` · ${whyOf(e,gg)}${rr}</div>`;
    }).join('');
    const lbl=GEOS.map(gg=>`${gg.short} <b style="color:${gg.color}">${fmt(gg.sc[i],1)}</b>`).join('　');
    tip.innerHTML=`<b>${g.dates[i]}</b><br>${lbl}<br>指数 ${g.close[i]}`+evTxt;
  });
  svg.addEventListener('mouseleave',()=>{
    svg.querySelectorAll('.hoverline,.hoverdot').forEach(n=>n.style.display='none');
    $('tip').style.display='none';
  });
}

function drawUnion(){
  const B=DATA[cur], el=$('plot');
  const ovl=$('ovl').checked;
  const [i0,i1]=winIdx(B), N=i1-i0+1;
  const cl=B.close.slice(i0,i1+1), dt=B.dates.slice(i0,i1+1);
  /* 三张子图宽高比 ≈5:1；W 扣掉 .subchart 的 12px×2 padding + 1px×2 border */
  const W=Math.max(560,cvW-26);
  const H=Math.max(200,Math.min(300,Math.round(W*0.22)));
  const PADX=32,L=62,RM=54,TOPY=H*0.11,BOTY=H*0.86, PW=W-PADX*2-L-RM;
  const x=a=>L+PW*(a-i0)/(N-1);
  let clo=Math.min(...cl), chi=Math.max(...cl);
  const yc=v=>BOTY-(v-clo)/(chi-clo||1)*(BOTY-TOPY);
  const evs=(B.union_events||[]), evmap={};
  evs.forEach(e=>{(evmap[e.date]=evmap[e.date]||[]).push(e);});
  GEOS=[];
  const blocks=SUB3.map(c=>{
    const full = c.key==='swing'?(B.swing||[]):(c.key==='swing2'?(B.swing2||[]):(B.swing3||[]));
    const sc=full.slice(i0,i1+1);
    const T0=c.key==='swing'?SW().thr:(c.key==='swing2'?SRC2().thr:SRC3().thr);
    let lo=Math.min(...sc,T0), hi=Math.max(...sc,T0);
    const span=Math.max(hi-lo,8), pad=span*0.15;
    const yLo=lo-pad, yHi=hi+pad;
    const step=(yHi-yLo)>120?20:(yHi-yLo)>60?10:(yHi-yLo)>30?5:2;
    const yMin=Math.floor(yLo/step)*step, yMax=Math.ceil(yHi/step)*step;
    const y=v=>BOTY-(v-yMin)/(yMax-yMin)*(BOTY-TOPY);
    const P=[];
    if(T0>yMin) P.push(`<rect x="${L}" y="${y(T0)}" width="${PW}" height="${BOTY-y(T0)}" fill="#3ECF8E" opacity=".08"/>`);
    for(let v=Math.ceil(yMin/step)*step; v<=yMax+1e-9; v+=step){
      P.push(`<line x1="${L}" y1="${y(v)}" x2="${L+PW}" y2="${y(v)}" stroke="#141B26" stroke-width="1"/>`);
      P.push(`<text x="${L-10}" y="${y(v)+4}" fill="#71809A" font-size="12" text-anchor="end">${+v.toFixed(2)}</text>`);
    }
    P.push(`<line x1="${L}" y1="${BOTY}" x2="${L+PW}" y2="${BOTY}" stroke="#232D3C" stroke-width="1"/>`);
    P.push(`<line x1="${L}" y1="${y(T0)}" x2="${L+PW}" y2="${y(T0)}" stroke="#6FE39C"
             stroke-width="1.2" stroke-dasharray="4 3" opacity=".8"/>`);
    P.push(`<text x="${L+PW-4}" y="${y(T0)-5}" fill="#6FE39C" font-size="10.5"
             text-anchor="end" opacity=".9">触发线 ${T0}（跌破就提示）</text>`);
    if(ovl){
      let dd='';
      for(let a=i0;a<=i1;a++) dd+=(a>i0?'L':'M')+x(a).toFixed(1)+' '+yc(cl[a-i0]).toFixed(1);
      P.push(`<path d="${dd}" fill="none" stroke="#7A8CA3" stroke-width="1.4" opacity=".8"/>`);
    }
    const gid='g_'+c.key;
    let d='',a2=`M${L} ${BOTY} `;
    for(let a=i0;a<=i1;a++){const s=x(a).toFixed(1)+' '+y(sc[a-i0]).toFixed(1);d+=(a>i0?'L':'M')+s;a2+=`L${s} `;}
    a2+=`L${L+PW} ${BOTY} Z`;
    P.push(`<defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="${c.color}" stop-opacity=".26"/>
      <stop offset="100%" stop-color="${c.color}" stop-opacity="0"/></linearGradient></defs>`);
    P.push(`<path d="${a2}" fill="url(#${gid})"/>`);
    P.push(`<path d="${d}" fill="none" stroke="${c.color}" stroke-width="1.8" stroke-linejoin="round"/>`);
    evs.filter(e=>c.srcs.includes(e.src)).forEach(e=>{
      const a=B.dates.indexOf(e.date); if(a<i0||a>i1) return;
      P.push(sigMarker(+x(a).toFixed(1), y(sc[a-i0])+11, gradeOf(e)));
    });
    const lx=x(i1), ly=y(sc[N-1]);
    P.push(`<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4" fill="${c.color}" stroke="#0A0E14" stroke-width="2"/>`);
    P.push(`<text x="${(lx-8).toFixed(1)}" y="${(ly-10).toFixed(1)}" fill="${c.color}"
             font-size="12" font-weight="700" text-anchor="end">${fmt(sc[N-1],1)}</text>`);
    const nT=Math.min(6,N);
    for(let k=0;k<nT;k++){
      const a=i0+Math.round(k*(N-1)/(nT-1));
      const lab = N<=70 ? dt[a-i0].slice(5) : dt[a-i0].slice(0,7);
      P.push(`<text x="${x(a).toFixed(1)}" y="${BOTY+20}" fill="#71809A" font-size="12" text-anchor="middle">${lab}</text>`);
    }
    P.push(`<rect class="hoverline" width="1" height="${BOTY-TOPY}" y="${TOPY}" fill="${c.color}" opacity=".3" style="display:none"/>`);
    P.push(`<circle class="hoverdot" r="4.5" fill="#fff" style="display:none"/>`);
    GEOS.push({key:c.key,name:c.name,short:c.name,color:c.color,thr:T0,
               x,y,sc,L,PW,N,i0,W,dates:dt,close:cl,evmap,hold:SW().hold});
    return `<div class="subchart">
      <div class="schead">
        <span class="sdot" style="background:${c.color}"></span>
        <b style="color:${c.color}">${c.name}</b>
        <span class="shint">${c.hint}</span>
        <span class="sval">最新 <b style="color:${c.color}">${fmt(sc[N-1],1)}</b>　触发线 ≤${T0}${sc[N-1]<=T0?'　<b style="color:#6FE39C">已跌破</b>':''}</span>
      </div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block">${P.join('')}</svg>
    </div>`;
  }).join('');
  el.innerHTML=blocks;
  el.querySelectorAll('svg').forEach((svg,k)=>bindHover(svg,GEOS[k]));
  const ri=$('rnginfo');
  if(ri) ri.innerHTML='';        // 小机会·合并视图不显示日期区间与口径提示（2026-10-07 用户要求精简）
}

function drawChart(){
  if(MODE==='swing' && SRC==='union'){ drawUnion(); return; }
  const B=DATA[cur], el=$('plot');
  const ovl=$('ovl').checked;
  const [i0,i1]=winIdx(B), N=i1-i0+1;
  const SRB = MODE!=='swing' ? B.score
            : (SRC==='swing2' ? (B.swing2||[]) : SRC==='swing3' ? (B.swing3||[]) : (B.swing||[]));
  const EVB = MODE!=='swing' ? B.bottom
            : SRC==='swing2' ? (B.swing2_events||[])
            : SRC==='swing3' ? (B.swing3_events||[]) : (B.swing_events||[]);
  const sc=SRB.slice(i0,i1+1), cl=B.close.slice(i0,i1+1), dt=B.dates.slice(i0,i1+1);
  const SWG = MODE==='swing';
  const mc = SWG ? (SRC==='swing2'?'#C9A2FF':(SRC==='swing3'?'#FFB86B':'#63B3FF')) : '#63B3FF';

  const W=Math.max(560,cvW), H=Math.max(340,Math.min(460,Math.round(W*0.30)));
  const PADX=32, L=62, RM=54, TOPY=H*0.075, BOTY=H*0.90;
  const PW=W-PADX*2-L-RM;

  let lo=Math.min(...sc), hi=Math.max(...sc);
  const span=Math.max(hi-lo,10), pad=span*0.12;
  let yLo=lo-pad, yHi=hi+pad;
  if(0   >= lo-span) yLo=Math.min(yLo,0);
  if(100 <= hi+span) yHi=Math.max(yHi,100);
  const step=(yHi-yLo)>120?20:(yHi-yLo)>60?10:(yHi-yLo)>30?5:2;
  const yMin=Math.floor(yLo/step)*step, yMax=Math.ceil(yHi/step)*step;
  const y=v=>BOTY-(v-yMin)/(yMax-yMin)*(BOTY-TOPY);
  const x=a=>L+PW*(a-i0)/(N-1);

  let clo=Math.min(...cl), chi=Math.max(...cl);
  const yc=v=>BOTY-(v-clo)/(chi-clo||1)*(BOTY-TOPY);

  const P=[];
  const T0=THR();
  if(SWG){
    if(T0>yMin) P.push(`<rect x="${L}" y="${y(T0)}" width="${PW}" height="${BOTY-y(T0)}" fill="#3ECF8E" opacity=".08"/>`);
  }else{
    if(yMin<0) P.push(`<rect x="${L}" y="${y(0)}" width="${PW}" height="${BOTY-y(0)}" fill="#3ECF8E" opacity=".07"/>`);
    if(yMax>100) P.push(`<rect x="${L}" y="${TOPY}" width="${PW}" height="${y(100)-TOPY}" fill="#FF5C5C" opacity=".08"/>`);
  }
  for(let v=Math.ceil(yMin/step)*step; v<=yMax+1e-9; v+=step){
    P.push(`<line x1="${L}" y1="${y(v)}" x2="${L+PW}" y2="${y(v)}" stroke="#141B26" stroke-width="1"/>`);
    P.push(`<text x="${L-10}" y="${y(v)+4}" fill="#71809A" font-size="12" text-anchor="end">${+v.toFixed(2)}</text>`);
  }
  P.push(`<line x1="${L}" y1="${BOTY}" x2="${L+PW}" y2="${BOTY}" stroke="#232D3C" stroke-width="1"/>`);
  if(!SWG){
    [[0,'#3ECF8E','下'],[100,'#FF5C5C','上']].forEach(([v,c,dir])=>{
      if(v>=yMin&&v<=yMax)
        P.push(`<line x1="${L}" y1="${y(v)}" x2="${L+PW}" y2="${y(v)}" stroke="${c}" stroke-width="1.5" stroke-dasharray="6 4" opacity=".8"/>`);
      else
        P.push(`<text x="${L+6}" y="${v<yMin?BOTY-6:TOPY+13}" fill="${c}" font-size="10" opacity=".65">${v} 线在${dir}方（窗口外）</text>`);
    });
  }
  if(T0>=yMin&&T0<=yMax){
    const lab = `触发线 ${T0}（跌破就提示）`;
    P.push(`<line x1="${L}" y1="${y(T0)}" x2="${L+PW}" y2="${y(T0)}" stroke="#6FE39C"
             stroke-width="1.3" stroke-dasharray="4 3" opacity=".8"/>`);
    P.push(`<text x="${L+PW-4}" y="${y(T0)-5}" fill="#6FE39C" font-size="10.5"
             text-anchor="end" opacity=".9">${lab}</text>`);
  }
  if(ovl){
    let d='';
    for(let a=i0;a<=i1;a++) d+=(a>i0?'L':'M')+x(a).toFixed(1)+' '+yc(cl[a-i0]).toFixed(1);
    P.push(`<path d="${d}" fill="none" stroke="#7A8CA3" stroke-width="1.5" opacity=".8"/>`);
    P.push(`<text x="${L+PW+8}" y="${yc(chi)+4}" fill="#71809A" font-size="12">${Math.round(chi)}</text>`);
    P.push(`<text x="${L+PW+8}" y="${yc(clo)+4}" fill="#71809A" font-size="12">${Math.round(clo)}</text>`);
  }
  let d='',a2=`M${L} ${BOTY} `;
  for(let a=i0;a<=i1;a++){const s=x(a).toFixed(1)+' '+y(sc[a-i0]).toFixed(1);d+=(a>i0?'L':'M')+s;a2+=`L${s} `;}
  a2+=`L${L+PW} ${BOTY} Z`;
  P.push(`<defs><linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0%" stop-color="${mc}" stop-opacity=".28"/>
    <stop offset="100%" stop-color="${mc}" stop-opacity="0"/></linearGradient></defs>`);
  P.push(`<path d="${a2}" fill="url(#g1)"/>`);
  P.push(`<path d="${d}" fill="none" stroke="${mc}" stroke-width="2.2" stroke-linejoin="round"/>`);
  EVB.forEach(e=>{
    const a=B.dates.indexOf(e.date); if(a<i0||a>i1) return;
    P.push(sigMarker(+x(a).toFixed(1), y(sc[a-i0])+12, gradeOf(e)));
  });
  const lx=x(i1), ly=y(sc[N-1]);
  P.push(`<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="5" fill="${mc}" stroke="#0A0E14" stroke-width="2"/>`);
  P.push(`<text x="${(lx-9).toFixed(1)}" y="${(ly-11).toFixed(1)}" fill="${mc}"
           font-size="13" font-weight="700" text-anchor="end">${fmt(sc[N-1],1)}</text>`);
  const nT=Math.min(6,N);
  for(let k=0;k<nT;k++){
    const a=i0+Math.round(k*(N-1)/(nT-1));
    const lab = N<=70 ? dt[a-i0].slice(5) : dt[a-i0].slice(0,7);
    P.push(`<text x="${x(a).toFixed(1)}" y="${BOTY+22}" fill="#71809A" font-size="12" text-anchor="middle">${lab}</text>`);
  }
  P.push(`<rect class="hoverline" width="1" height="${BOTY-TOPY}" y="${TOPY}" fill="${mc}" opacity=".25" style="display:none"/>`);
  P.push(`<circle class="hoverdot" r="4.5" fill="#fff" style="display:none"/>`);

  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block">${P.join('')}</svg>`;
  const evmap={};
  EVB.forEach(e=>{(evmap[e.date]=evmap[e.date]||[]).push(e);});
  const geo={x,y,sc,close:cl,dates:dt,i0,N,W,H,L,PW,TOPY,BOTY,evmap,hold:HOLD2()};

  const svg=el.querySelector('svg');
  svg.addEventListener('mousemove',ev=>{
    const g=geo, r=svg.getBoundingClientRect();
    const px=(ev.clientX-r.left)/r.width*g.W;
    let i=Math.round((px-g.L)/(g.PW/(g.N-1)));
    i=Math.max(0,Math.min(g.N-1,i));
    const hx=g.x(g.i0+i);
    const hv=svg.querySelector('.hoverline'), hd=svg.querySelector('.hoverdot');
    hv.setAttribute('x',hx);hv.style.display='';
    hd.setAttribute('cx',hx);hd.setAttribute('cy',g.y(g.sc[i]));hd.style.display='';
    const tip=$('tip');
    tip.style.display='block';tip.style.left=(ev.clientX+14)+'px';tip.style.top=(ev.clientY-10)+'px';
    const evs2=g.evmap[g.dates[i]]||[];
    const evTxt=evs2.map(e=>{
      const gg=gradeOf(e);
      const nm=(MODE==='swing'?'提示：跌到位了（小波段）':'大底提示');
      const rr=(e.ret!=null?`　之后 ${g.hold} 天 ${e.ret>0?'+':''}${fmt(e.ret)}%`:`　之后 ${g.hold} 天 待验证`);
      return `<div style="margin-top:4px"><b style="color:${GCOL[gg]}">${gg} 级</b> ${nm}
              · ${whyOf(e,gg)}${rr}</div>`;
    }).join('');
    const mname = MODE!=='swing' ? '大机会温度'
      : SRC==='swing2' ? '跌势放缓' : SRC==='swing3' ? '均线止跌' : '跌得深';
    tip.innerHTML=`<b>${g.dates[i]}</b><br>${mname} <b style="color:${mc}">${fmt(g.sc[i],1)}</b>`
      + `<br>指数 ${g.close[i]}` + evTxt;
  });
  svg.addEventListener('mouseleave',()=>{
    svg.querySelectorAll('.hoverline,.hoverdot').forEach(n=>n.style.display='none');
    $('tip').style.display='none';
  });

  const ri=$('rnginfo');
  if(ri) ri.innerHTML=`${dt[0]} ~ ${dt[N-1]}　·　${N} 个交易日　·　最新 `
    +`<b style="color:${mc}">${fmt(sc[N-1],1)}</b>`;
}

/* ---------- 图例 / 大白话说明 / 实测数字（随模式切换） ---------- */
const LEGEND_SENTI =

   <span style="white-space:nowrap">提示点等级：
     <b style="color:#6FE39C">▲A</b> 证据最足（实心+环）

const LEGEND_ONE_TAIL =
  `<span><i style="background:#7A8CA3"></i>指数走势（灰线，对照看）</span>

   <span><i style="background:#6FE39C"></i>触发线</span>
   <span style="white-space:nowrap">提示点等级（＝当天几个板块一起提示）：
     <b style="color:#4FD1E8">▲S</b> ≥5 个，最可信　
     <b style="color:#6FE39C">▲A</b> 4 个　
     <b style="color:#F5B544">▲B</b> 2~3 个　
     <b style="color:#96A5BA">△C</b> 只有自己</span>`;
const LEGEND_UNION =
  `<span><i style="background:#63B3FF"></i>跌得深　≤${SW().thr} 提示</span>
   <span><i style="background:#C9A2FF"></i>跌势放缓　≤${SRC2().thr} 提示</span>
   <span><i style="background:#FFB86B"></i>均线止跌　≤${SRC3().thr} 且当天须放缓</span>
   <span><i style="background:#7A8CA3"></i>指数走势（灰线，对照看）</span>
   <span style="white-space:nowrap">提示点等级（＝当天几个板块一起提示）：
     <b style="color:#4FD1E8">▲S</b> ≥5 个，最可信　
     <b style="color:#6FE39C">▲A</b> 4 个　
     <b style="color:#F5B544">▲B</b> 2~3 个　
     <b style="color:#96A5BA">△C</b> 只有自己</span>`;

function renderMeta(){
  const SWG=MODE==='swing', sw=SW();
  mtabsEl.style.display = SWG ? '' : 'none';
  $('legend').innerHTML =
    !SWG ? LEGEND_SENTI
         : (SRC==='union' ? LEGEND_UNION
            : (LEGEND_ONE_HEAD[SRC]||LEGEND_ONE_HEAD.swing)+LEGEND_ONE_TAIL);

  /* 大白话说明（折叠）。表达纪律：SWING 全部与 S 级分开说；信号级/事件级两个数都给 */
  const u=(SUM.union&&SUM.union.total)||{};
  const ev=(SUM.event&&SUM.event.union)||{};
  const swt=(SUM.swing&&SUM.swing.total)||{};
  $('gbody').innerHTML = SWG
    ? `<b class="k">这三个名字是什么意思</b>：
       <b style="color:#63B3FF">跌得深</b>＝看价格跌到多低（离近期高点和各条均线有多远）；
       <b style="color:#C9A2FF">跌势放缓</b>＝看下跌的劲还有多大（劲快没了，哪怕价格还在创新低）；
       <b style="color:#FFB86B">均线止跌</b>＝看平均线还跌得多急，且当天已经开始放缓。
       三个看法很少同时提示，所以合起来机会最多。
       <br><b class="k">提示次数 ≠ 独立机会</b>：近 3 年 6 个板块共提示 <b class="k">${u.n??189} 次</b>，
       但同一波下跌里常隔几天又提示一次；按「同一波只算第一次」合并后是 <b class="k">${ev.n??136} 波</b>。
       之后 7 天上涨的比例：按次数算 <b class="k">${u.rate??70.9}%</b>、按波算 <b class="k">${ev.rate??67.6}%</b>
       （保守下限 ${ev.wilson??59.4}%）。闭眼随便买的日子约 <b class="k">${u.base??48.6}%</b> 上涨。
       <br><b class="k">等级 = 当天有几个板块一起提示</b>（含自己）：S（≥5 个）/ A（4 个）/ B（2~3 个）/ C（只有自己）。
       一起跌的板块越多，越像市场整体回调，而不是这个板块自身的问题。
       等级<b class="k">不决定出不出提示</b>，只用来定仓位轻重。
       <br><b class="k">别拿 S 级当全部提示的水平</b>：以「跌得深」为例，全部提示约 ${swt.rate??64}% 上涨，
       S 级约 87%，但 S 级一年只有 3~5 次。
       <br><b class="k">判定口径</b>：提示后第 ${sw.hold} 天收盘高于提示日，且中间最多浅套 ${sw.tol}%。`
    : `<b class="k">等级有什么用</b>：等级<b class="k">不决定出不出提示</b>，只用来定仓位——
       <b style="color:#6FE39C">A</b>：「估值投降」和「多板块一起恐慌」两个证据都成立，最足；
       <b style="color:#F5B544">B</b>：只成立一个；
       <b style="color:#96A5BA">C</b>：都没成立，建议减半或观望。
       近 3 年：A 级 3 次（3/3 命中）、B 级 16 次（14/16）、C 级 0 次。
       <br><b class="k">大底提示的整体水平</b>：13 年里按「独立行情」算是 18 次、14 次命中（约 78%）。
       近 3 年的 17 次提示其实只对应 5 波行情，所以别看 17/19 就说 89%。
       <br><b style="color:#FF5C5C">没有顶部提示</b>：原来的「涨过头」提示实测和瞎猜没区别（2/9），已取消。
       温度超过 100 仍然照画，但只是「过热」读数，<b class="k">不是卖出信号</b>。`;

  /* 实测数字 chip（图上方，跟着模式走）；小机会模式不显示（2026-10-07 用户要求精简） */
  const ms=$('modestat');
  if(SWG){
    ms.innerHTML = '';
  }else{
    const t=SUM.total||{};
    ms.innerHTML = `过去3年·6板块：大底提示 <b>${t.b_ok??0}/${t.b_n??0} 次命中</b>（只对应约 5 波独立行情）`
      + `　·　13 年按独立行情 <b>78%</b>（14/18）`
      + `　·　闭眼买约 <b>${(SUM.per&&SUM.per[cur])?SUM.per[cur].base_bottom:'—'}%</b>`;
  }

  /* 底部通栏 */
  $('footstrip').innerHTML = SWG
    ? `<span>过去 3 年·6 个板块：这样提示过 <b>${u.n??189} 次</b>（其实是 <b>${ev.n??136} 波</b>不同的下跌），
        之后 7 天上涨的占 <b>${u.rate??70.9}%</b>（按波算 <b>${ev.rate??67.6}%</b>）｜
        闭眼随便买约 <b>${u.base??48.6}%</b> ｜ S 级一年只有 3~5 次，别把它的命中率当成全部提示的水平</span>
       <span>本页仅供复盘研究，不构成投资建议</span>`
    : `<span>大波段·13 年：<b>18</b> 次大底提示按独立行情 <b>14</b> 次命中（约 <b>78%</b>）｜
        近 3 年的 17 次提示只对应 5 波行情，不是 17 次独立机会</span>
       <span>本页仅供复盘研究，不构成投资建议</span>`;

function render(){
  const B=DATA[cur];
  const tab=MTABS.find(t=>t.k===SRC);
  $('ctitle').innerHTML = MODE==='swing'
    ? `${B.name} · 小机会温度<small>当前看：${tab.n} —— ${tab.hint}</small>`
    : `${B.name} · 大机会温度<small>温度越低 = 越恐慌；跌破触发线才提示，看 20~60 天</small>`;

  renderBoards();
  drawChart();
  renderMeta();
}

$('ovl').onchange=drawChart;
