<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A股板块恐贪情绪指数 · SENTI-1</title>
<style>
  :root{
    /* 面：越"高"越亮；冷调石板灰，刻意避开纯黑与纯灰 */
    --bg:#070A0F; --card:#0E131A; --card2:#131A23; --card3:#1A222D;
    --bd:rgba(148,171,200,.10); --bd2:rgba(148,171,200,.18); --bd3:rgba(148,171,200,.28);
    /* 字：近白但不刺眼，三级灰阶 */
    --tx:#E7EDF6; --mut:#96A5BA; --dim:#7A8AA1;
    /* 语义色：红涨绿跌（A 股口径，勿改） */
    --red:#FF5C5C; --grn:#3ECF8E; --blu:#5FA8FF; --yel:#F5B544; --pur:#A78BFA; --cyn:#4FD1E8;
    --r:16px; --r2:11px; --r3:8px;
    --ease:cubic-bezier(.22,1,.36,1);
    --sh:0 1px 0 rgba(255,255,255,.045) inset, 0 20px 46px -32px rgba(0,0,0,.95);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
       background:
         radial-gradient(1100px 520px at 10% -12%, rgba(95,168,255,.10), transparent 62%),
         radial-gradient(900px 420px at 88% -6%, rgba(62,207,142,.05), transparent 60%),
         var(--bg);
       background-attachment:fixed;
       color:var(--tx);
       font-family:"Inter","Inter var",-apple-system,"Segoe UI",Roboto,
                   "PingFang SC","Microsoft YaHei",sans-serif;
       font-size:14px;line-height:1.6;padding:0 0 56px;
       font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
  body::before{content:"";display:block;height:2px;
       background:linear-gradient(90deg,#2C6BD6,#5FA8FF 24%,#4FD1E8 46%,#3ECF8E 66%,
                                  #F5B544 84%,#FF5C5C)}
  .wrap{max-width:1660px;margin:0 auto;padding:0 20px}
  ::selection{background:rgba(95,168,255,.26);color:#fff}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:#1E2733;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#28323F}

  /* ---------- header ---------- */
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;
         flex-wrap:wrap;border-bottom:1px solid var(--bd);
         padding:26px 0 18px;margin-bottom:16px}
  .title{font-size:22px;font-weight:600;letter-spacing:-.2px;line-height:1.3;color:#F2F6FB}
  .title::before{content:"";display:inline-block;width:3px;height:20px;border-radius:2px;
         background:linear-gradient(180deg,var(--blu),#2C6BD6);margin-right:12px;vertical-align:-3px}
  .title span{color:var(--blu)}
  .sub{color:var(--dim);font-size:12px;margin-top:7px;text-align:right;line-height:1.85}

  /* ---------- mode switch ---------- */
  .modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
         gap:12px;margin-bottom:14px}
  .mode{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--bd);
        border-radius:var(--r2);padding:14px 16px 14px 19px;cursor:pointer;text-align:left;
        font-family:inherit;color:var(--mut);
        transition:border-color .18s var(--ease),background .18s var(--ease),
                   transform .18s var(--ease),box-shadow .18s var(--ease)}
  .mode::before{content:"";position:absolute;left:0;top:15px;bottom:15px;width:2px;
        border-radius:0 2px 2px 0;background:transparent;transition:background .18s var(--ease)}
  .mode:hover{border-color:var(--bd2);background:var(--card2);transform:translateY(-1px)}
  .mode .mn{font-size:14px;font-weight:600;color:var(--tx);
        display:flex;align-items:center;gap:9px;letter-spacing:-.1px}
  .mode .mn::before{content:"";width:6px;height:6px;border-radius:50%;
        background:#39455A;flex:none;transition:.18s var(--ease)}
  .mode .md{font-size:12px;margin-top:6px;line-height:1.65;color:var(--dim)}
  .mode.on{border-color:rgba(95,168,255,.40);
        background:linear-gradient(180deg,rgba(95,168,255,.10),rgba(95,168,255,.02) 72%),var(--card);
        box-shadow:0 10px 28px -20px rgba(95,168,255,.95)}
  .mode.on::before{background:var(--blu)}
  .mode.on .mn{color:#DCEBFF}
  .mode.on .md{color:var(--mut)}
  .mode.on .mn::before{background:var(--blu);box-shadow:0 0 0 3px rgba(95,168,255,.20)}
  .mode:focus-visible{outline:2px solid var(--blu);outline-offset:2px}

  /* ---------- 小波段信号源切换（仅 SWING 模式显示） ---------- */
  .srcsel{display:none;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 14px;
          padding:8px 10px;background:var(--card2);border:1px solid var(--bd);border-radius:10px}
  .srcsel.on{display:flex}
  .srcsel .sl{font-size:12px;color:var(--dim);margin-right:2px;white-space:nowrap}
  .srcsel button{font:inherit;font-size:12px;color:var(--mut);cursor:pointer;
                 background:var(--card3);border:1px solid var(--bd);border-radius:8px;
                 padding:5px 11px;transition:.16s}
  .srcsel button:hover{border-color:var(--bd2);color:var(--tx)}
  .srcsel button.on{background:rgba(95,168,255,.14);border-color:rgba(95,168,255,.45);color:#DCEBFF}
  .srcsel .sn{margin-left:auto;font-size:12px;color:var(--dim);white-space:nowrap}
  /* 两个信号源名字的通俗解释（占满整行） */
  .srcsel .sh{flex-basis:100%;font-size:12px;color:var(--dim);line-height:1.8;
              margin-top:4px;padding-top:7px;border-top:1px solid var(--bd)}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;
        background:rgba(14,19,26,.82);border:1px solid var(--bd);border-radius:12px;padding:4px;
        position:sticky;top:0;z-index:20;backdrop-filter:blur(14px) saturate(140%);
        -webkit-backdrop-filter:blur(14px) saturate(140%);
        box-shadow:0 10px 26px -22px rgba(0,0,0,1)}
  .tab{background:none;border:0;color:var(--mut);
       padding:8px 16px;border-radius:var(--r3);cursor:pointer;font-size:13.5px;
       font-family:inherit;white-space:nowrap;letter-spacing:-.05px;
       transition:color .16s var(--ease),background .16s var(--ease),box-shadow .16s var(--ease)}
  .tab:hover{background:var(--card3);color:var(--tx)}
  .tab.on{background:linear-gradient(180deg,rgba(95,168,255,.22),rgba(95,168,255,.10));
          box-shadow:inset 0 0 0 1px rgba(95,168,255,.45);color:#DCEBFF;font-weight:600}
  .tab:focus-visible,.rng button:focus-visible{outline:2px solid var(--blu);outline-offset:2px}

  /* ---------- layout ---------- */
  .hero{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;
        margin-bottom:18px;align-items:stretch}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,0) 42%),
                   var(--card);
        border:1px solid var(--bd);border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
  /* 左卡内容比右卡（图表）矮：撑满同高后，让「最近信号」沉底，不留大片空白 */
  .hero > .card:first-child{display:flex;flex-direction:column}
  .hero > .card:first-child .barlab{margin-bottom:14px}
  .hero > .card:first-child .lsig{margin-top:auto}

  /* ---------- score panel ---------- */
  .lab{color:var(--mut);font-size:12px;font-weight:600;letter-spacing:.06em;
       display:flex;align-items:center;gap:8px}
  .lab::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--blu);
       flex:none;box-shadow:0 0 0 3px rgba(95,168,255,.16)}
  .big{font-size:clamp(44px,3.6vw,60px);font-weight:600;line-height:1.02;
       margin:10px 0 0 -1px;font-variant-numeric:tabular-nums;letter-spacing:-2px;
       text-shadow:0 0 34px rgba(0,0,0,.55)}
  .big::after{content:"分";font-size:14px;font-weight:500;color:var(--dim);
       margin-left:7px;letter-spacing:0;vertical-align:5px;text-shadow:none}
  .tag{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;
       font-size:12px;font-weight:600;margin-top:11px;letter-spacing:.01em}
  /* 不再用"盒中盒"：改成发丝分隔的读数行 */
  .chg{margin-top:16px;display:grid;border-top:1px solid var(--bd)}
  .chg div{background:none;border:0;border-bottom:1px solid var(--bd);
           padding:10px 2px;font-size:12px;color:var(--mut);
           display:flex;justify-content:space-between;align-items:center;gap:10px}
  .chg div:last-child{border-bottom:0}
  .chg b{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--tx)}

  .bar{position:relative;height:10px;margin-top:20px;border-radius:999px;overflow:visible;
       background:linear-gradient(90deg,#26794F 0%,#2C6E8A 26%,#7C6A2E 62%,#A63A36 82%,#C33B33 100%);
       box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 2px 8px -4px rgba(0,0,0,.8)}
  .bar .mk{position:absolute;top:-6px;width:3px;height:22px;background:#fff;
           border-radius:2px;box-shadow:0 0 0 2px var(--card),0 0 12px rgba(255,255,255,.45);
           transition:left .35s var(--ease)}
  .bar .tk{position:absolute;top:-4px;width:1px;height:18px;background:rgba(231,237,246,.30)}
  .barscale{position:relative;height:18px;margin-top:9px}
  .barscale span{position:absolute;transform:translateX(-50%);font-size:12px;
                 color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
  .barscale span:first-child{transform:none}
  .barscale span:last-child{transform:translateX(-100%)}
  .barlab{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;
          letter-spacing:.04em}

  .lsig{margin-top:16px;padding-top:13px;border-top:1px solid var(--bd);
        font-size:12px;color:var(--mut);line-height:1.85}

  /* ---------- chart panel ---------- */
  .chartcard{padding:18px 20px 14px;display:flex;flex-direction:column}
  .chead{display:flex;justify-content:space-between;align-items:center;
         margin-bottom:12px;flex-wrap:wrap;gap:10px;
         padding-bottom:12px;border-bottom:1px solid var(--bd)}
  .ctitle{font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px;
          letter-spacing:-.1px;color:#F2F6FB}
  .ctitle::before{content:"";width:3px;height:15px;border-radius:2px;
          background:linear-gradient(180deg,var(--blu),#2C6BD6)}
  .rng{display:flex;flex-wrap:wrap;gap:2px;background:var(--card2);
       border:1px solid var(--bd);border-radius:9px;padding:3px}
  .rng button{background:none;border:0;color:var(--dim);font-size:12px;font-weight:500;
       padding:5px 11px;border-radius:6px;cursor:pointer;font-family:inherit;
       transition:color .16s var(--ease),background .16s var(--ease),box-shadow .16s var(--ease)}
  .rng button:hover{color:var(--tx);background:var(--card3)}
  .rng button.on{background:rgba(95,168,255,.18);color:#CBDEFF;font-weight:600;
       box-shadow:inset 0 0 0 1px rgba(95,168,255,.40)}

  .opts{display:flex;gap:10px;align-items:center;color:var(--mut);font-size:12px;
        margin-bottom:8px;flex-wrap:wrap}
  .opts label{cursor:pointer;display:inline-flex;align-items:center;gap:7px;
        padding:5px 11px;background:var(--card2);border:1px solid var(--bd);
        border-radius:var(--r3);user-select:none;
        transition:border-color .16s var(--ease),color .16s var(--ease),background .16s var(--ease)}
  .opts label:hover{border-color:var(--bd2);color:var(--tx);background:var(--card3)}
  .opts input{accent-color:var(--blu);width:13px;height:13px;margin:0}
  #rnginfo{color:var(--dim)}
  /* 实测命中率是关键读数：给它一个 chip，与旁边的辅助文字拉开层级 */
  #modestat{color:var(--mut);padding:5px 12px;background:var(--card2);
    border:1px solid var(--bd);border-radius:var(--r3);line-height:1.5}
  #plot{width:100%;border-radius:10px;margin-top:2px}

  .legend{display:flex;gap:7px 8px;flex-wrap:wrap;color:var(--mut);font-size:12px;
          padding:12px 0 2px}
  .legend > span{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;
          background:rgba(148,171,200,.05);border:1px solid var(--bd);
          border-radius:999px;line-height:1.6}
  .legend i{display:inline-block;width:14px;height:3px;border-radius:2px;flex:none}

  .gnote{margin-top:14px;background:var(--card2);border:1px solid var(--bd);
         border-radius:var(--r2);overflow:hidden}
  .gnote summary{cursor:pointer;padding:11px 14px;font-size:12.5px;color:var(--tx);
         font-weight:600;list-style:none;display:flex;align-items:center;gap:9px;user-select:none;
         transition:background .16s var(--ease)}
  .gnote summary:hover{background:var(--card3)}
  .gnote summary::-webkit-details-marker{display:none}
  .gnote summary::before{content:"";width:5px;height:5px;border-radius:50%;
         background:var(--yel);flex:none;box-shadow:0 0 0 3px rgba(245,181,68,.16)}
  .gnote summary::after{content:"▾";margin-left:auto;color:var(--dim);font-size:12px;
         transition:transform .2s var(--ease)}
  .gnote[open] summary::after{transform:rotate(180deg)}
  .gbody{padding:12px 14px 14px;font-size:12px;color:var(--mut);line-height:1.9;
         border-top:1px solid var(--bd)}
  .gbody b.k{color:var(--tx);font-weight:600}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--mut);font-weight:500;font-size:12px;
     padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
  td{padding:8px 10px;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  .ok{color:var(--grn)} .no{color:var(--red)} .yel{color:var(--yel)}
  .up{color:var(--red)} .dn{color:var(--grn)}
  .empty{color:var(--dim);font-size:13px;padding:16px 10px}

  .foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--bd);
        color:var(--dim);font-size:12px;display:flex;justify-content:space-between;
        gap:16px;flex-wrap:wrap}

  #tip{position:fixed;pointer-events:none;background:rgba(10,14,20,.96);border:1px solid var(--bd2);
       border-radius:12px;padding:11px 14px;font-size:12px;display:none;z-index:99;
       box-shadow:0 18px 44px -18px rgba(0,0,0,.95);white-space:nowrap;line-height:1.8;
       backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

  @media(max-width:1080px){
    .hero{grid-template-columns:1fr}
    .sub{text-align:left}
  }
  @media(max-width:640px){
    .wrap{padding:0 12px}
    .tabs{position:static}
    .big{font-size:46px}
    .card{padding:18px}
    .chartcard{padding:16px 14px 12px}
  }
  @media(prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">A股板块<span>恐贪情绪指数</span> · SENTI-1</div>
    <div class="sub">单一模型 · 近3年（{{ meta.start }} ~ {{ meta.last_date }}） ·
      数据生成 {{ meta.built_at }} · 判定窗口 T+{{ hold }}
      <span style="opacity:.75">　|　说明见 README.md / DELIVERY.md</span></div>
  </header>

  <div class="modes" id="modes"></div>

  <div class="tabs" id="tabs"></div>

  <div class="hero">
    <div class="card">
      <div class="lab" id="bname">板块</div>
      <div class="big" id="sval">--</div>
      <div id="stag"></div>
      <div class="chg" id="schg"></div>
      <div class="bar">
        <div class="mk" id="mk" style="left:50%"></div>
        <i class="tk" style="left:18.75%"></i><i class="tk" style="left:81.25%"></i>
      </div>
      <div class="barscale" id="barscale">
        <span style="left:0%">-30</span><span style="left:18.75%">0</span>
        <span style="left:81.25%">100</span><span style="left:100%">140</span>
      </div>
      <div class="barlab" id="barlab"><span>恐慌</span><span>贪婪</span></div>
      <div class="lsig" id="lsig"></div>
    </div>
    <div class="card chartcard">
      <div class="chead">
        <div class="ctitle">情绪分值走势</div>
        <div class="rng" id="rng"></div>
      </div>
      <div class="opts">
        <label><input type="checkbox" id="ovl" checked> 叠加指数收盘</label>
        <span id="rnginfo"></span>
        <span id="modestat"></span>
      </div>
      <div id="plot"></div>
      <div class="legend" id="legend"></div>
      <details class="gnote">
        <summary id="gsum">等级说明：A / B / C 怎么用</summary>
        <div class="gbody" id="gbody"></div>
      </details>
    </div>
  </div>

  <div class="foot">
    <span>本页仅用于研究复盘，不构成投资建议</span>
    <span>模型 SENTI-1　·　详细说明见 README.md / DELIVERY.md</span>
  </div>
</div>
<div id="tip"></div>

<script>
const DATA = {{ payload|tojson }};
const SUM  = {{ summary|tojson }};
const KEYS = {{ boards|tojson }};
const HOLD = {{ hold }};
let cur = KEYS[0].key;

/* ---------- 模式：大波段 SENTI-1 / 小波段 SWING ---------- */
let MODE = 'senti';
const MODES = [
  {k:'senti', n:'大波段 · SENTI-1',
   d:'抓「投降底」：恐慌放量、估值投降。信号少而重，判定看 T+20 / T+60。'},
  {k:'swing', n:'小波段 · 三模型',
   d:'抓 4～10 天波段低点。三个正交模型：回调底 / 动量拐点 / 均线拐点，'
    +'判定看 T+7。　合并后 189 次信号（去重后 136 件事）、命中 70.9%（基线 48.6%）。'}
];
const modesEl = document.getElementById('modes');
MODES.forEach(m=>{
  const b=document.createElement('button');
  b.className='mode'+(m.k===MODE?' on':''); b.dataset.k=m.k; b.type='button';
  b.innerHTML=`<div class="mn">${m.n}</div><div class="md">${m.d}</div>`;
  b.onclick=()=>{MODE=m.k;
    modesEl.querySelectorAll('.mode').forEach(x=>x.classList.toggle('on',x.dataset.k===MODE));
    syncSrc();render();};
  modesEl.appendChild(b);
});

/* ---------- 小波段信号源：回调底 / 动量拐点 / 均线拐点 / 合并 ----------
   合并是默认视图：三个模型信号几乎不重叠
   （J(回调底,动量拐点)=0.15、J(均线拐点,回调底)=0.03、J(均线拐点,动量拐点)=0.00），
   合并后信号数 143 → 189（+32%），命中率 66.4% → 70.9%。
   ⚠️ 事件级（同板块 ±4 自然日只算第一枪，见 store.EVENT_GAP）：
   189 次信号实际只对应 136 件事，事件级命中 67.6%（下界 59.4%）。
   页面同时显示「信号 N 次」与「事件 M 件」，前者是画了多少个点，
   后者才是独立的入场机会数。 */
let SRC = 'union';
const SRCS = [
  {k:'union',  n:'合并（默认）',  d:'三个模型都算，同日去重。信号最多。'},
  {k:'swing',  n:'回调底 SWING',  d:'价格位置 + 热度同时到极端分位。'},
  {k:'swing2', n:'动量拐点 SWING-2', d:'MACD 柱跌到自身极低分位。'},
  {k:'swing3', n:'均线拐点 SWING-3', d:'MA20 斜率跌到极低分位，且当日斜率回升。'},
];
const srcEl=document.createElement('div');
srcEl.className='srcsel'; srcEl.id='srcsel';
if(modesEl.parentNode) modesEl.parentNode.insertBefore(srcEl, modesEl.nextSibling);
const SRC2 = () => SUM.swing2 || {thr:12, hold:7, cool:4, tol:3};
const SRC3 = () => SUM.swing3 || {thr:10, hold:7, cool:4, tol:3};
SRCS.forEach(s=>{
  const b=document.createElement('button');
  b.type='button'; b.dataset.k=s.k; b.textContent=s.n; b.title=s.d;
  b.onclick=()=>{SRC=s.k;syncSrc();render();};
  srcEl.appendChild(b);
});
const srcNote=document.createElement('span'); srcNote.className='sn'; srcEl.appendChild(srcNote);
/* 两个信号源名字的通俗解释：用户反馈「看不懂」，必须写清楚各自在看什么 */
const srcHint=document.createElement('div'); srcHint.className='sh';
srcHint.innerHTML=
  '<b style="color:#5FA8FF">回调底</b>＝看「跌到哪了」：价格离近期高点和各条均线都很远，'
 +'位置跌到自身历史的极端低位 —— 跌得够深、够偏才算数。'
 +'　<b style="color:#C9A2FF">动量拐点</b>＝看「跌得还有多快」：'
 +'MACD 柱（下跌动能）跌到自身历史极低分位，说明跌势正在衰竭，哪怕价格还在创新低。'
 +'　<b style="color:#FFB86B">均线拐点</b>＝看「均线还跌得多急」：'
 +'MA20 的 5 日斜率跌到历史极低分位，<b>且当天斜率已经回升</b>'
 +'（跌势开始趋缓）—— 这是「跌速的拐点」，不是价格的拐点。'
 +'　三者几乎不重叠（均线拐点与动量拐点完全不重合），所以合并起来看信号最多。';
srcEl.appendChild(srcHint);
function syncSrc(){
  const on = (MODE==='swing');
  srcEl.classList.toggle('on', on);
  srcEl.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.k===SRC));
  if(!on){ srcNote.textContent=''; return; }
  const u=(SUM.union&&SUM.union.total)||{};
  const s2=(SUM.swing2&&SUM.swing2.total)||{};
  const s3=(SUM.swing3&&SUM.swing3.total)||{};
  const sw=(SUM.swing&&SUM.swing.total)||{};
  const pick = SRC==='union'?u:(SRC==='swing2'?s2:(SRC==='swing3'?s3:sw));
  /* 事件级：同板块 ±4 自然日只算第一枪（同一波下跌不重复计数） */
  const ev = SUM.event||{};
  const ek = SRC==='union'?'union':(SRC==='swing2'?'swing2':(SRC==='swing3'?'swing3':'swing'));
  const e2 = ev[ek]||{};
  srcNote.textContent = `信号 ${pick.n??'—'} 次（事件 ${e2.n??'—'} 件）`
    +` · 信号命中 ${pick.rate??'—'}% · 事件命中 ${e2.rate??'—'}%（下界 ${e2.wilson??'—'}%）`
    +` · 基线 ${pick.base??'—'}%`;
}

/* 当前模式下取哪条曲线 / 哪些信号 / 阈值 / 持有期 */
const SW = () => SUM.swing || {thr:22, hold:7, cool:4, tol:3};
/* 合并视图同时画三条曲线：SWING 实线 + SWING-2 虚线 + SWING-3 点线（都是 0~100 同刻度，可比） */
const SR   = B => MODE!=='swing' ? B.score
                : (SRC==='swing2' ? (B.swing2||[])
                 : SRC==='swing3' ? (B.swing3||[]) : (B.swing||[]));
const SR2  = B => (MODE==='swing' && SRC==='union') ? (B.swing2||[]) : null;
const SR3  = B => (MODE==='swing' && SRC==='union') ? (B.swing3||[]) : null;
const EVS  = B => MODE!=='swing' ? B.bottom
                : SRC==='union'  ? (B.union_events||[])
                : SRC==='swing2' ? (B.swing2_events||[])
                : SRC==='swing3' ? (B.swing3_events||[])
                : (B.swing_events||[]);
const THR  = () => MODE!=='swing' ? (SUM.entry_thr ?? 0)
                : (SRC==='swing2' ? SRC2().thr : (SRC==='swing3' ? SRC3().thr : SW().thr));
const THR2 = () => (MODE==='swing' && SRC==='union') ? SRC2().thr : null;
const THR3 = () => (MODE==='swing' && SRC==='union') ? SRC3().thr : null;
const HOLD2= () => MODE==='swing' ? SW().hold : HOLD;

const fmt=(n,d=2)=>(n===null||isNaN(n))?'--':Number(n).toFixed(d);
function state(v){

    const t=THR();
    if(v<=t)     return ['超卖 · 已达小波段入场阈值','#6FE39C'];

    if(v<60)     return ['中性','#96A5BA'];

  }
  if(v<=(SUM.entry_thr??0)) return ['极度恐慌 · 已达入场阈值','#6FE39C'];

  if(v<80)  return ['偏热','#F5B544'];

/* 置信等级配色与释义（全页统一口径） */
const GCOL={S:'#4FD1E8',A:'#6FE39C',B:'#F5B544',C:'#96A5BA'};
const GWHY={bottom:{A:'估值投降 + 全场共振',B:'只满足其中一个确认层',C:'两个确认层都不满足'}};
/* SWING 只有"共振强弱"这一个确认层：当天还有几个别的板块也超卖 */
const GWHY2={S:'全场共振 ≥5 个板块（实测 87%）',A:'共振 4 个板块（实测 79%）',
             B:'共振 2~3 个板块',C:'仅本板块超卖'};
function gradeOf(e){
  if(MODE==='swing'){
    /* 合并视图用「并集口径共振」：同一天有多少个板块出现了任一模型的信号 */
    const r = SRC==='union' ? (e.ures||e.reso||1) : (e.reso||1);
    return r>=5?'S':(r>=4?'A':(r>=2?'B':'C')); }
  return e.grade||'C';
}
const whyOf=(e,g)=> MODE==='swing' ? (GWHY2[g]||'') : ((GWHY[e.kind]||{})[g]||'');

/* ---------- chart ---------- */
let cvW=900;
function measure(){ cvW = document.getElementById('plot').clientWidth || 900; }

/* ---------- 时间范围（以数据最后一天为基准，按自然日回溯） ---------- */
const RANGES=[['7d','近7天',7],['1m','近1个月',30],['3m','近3个月',91],
              ['6m','近半年',182],['1y','近1年',365],['all','全部',null]];
let RNG='all';
const rngEl=document.getElementById('rng');
RANGES.forEach(([k,lab,d])=>{

    drawChart();};

});

/* 窗口的绝对索引 [i0,i1] */
function winIdx(B){
  const n=B.dates.length, i1=n-1;
  const r=RANGES.find(r=>r[0]===RNG);
  const days=r?r[2]:null;
  if(days==null) return [0,i1];
  const t=new Date(B.dates[i1]+'T00:00:00'); t.setDate(t.getDate()-days);
  const cut=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')
            +'-'+String(t.getDate()).padStart(2,'0');
  let i0=i1; while(i0>0 && B.dates[i0-1]>=cut) i0--;
  if(i1-i0<4) i0=Math.max(0,i1-4);            // 窗口内至少 5 个点
  return [i0,i1];
}

function drawChart(){
  const B=DATA[cur], el=document.getElementById('plot');
  const ovl  =document.getElementById('ovl').checked;
  const [i0,i1]=winIdx(B), N=i1-i0+1;
  const sc=SR(B).slice(i0,i1+1), cl=B.close.slice(i0,i1+1), dt=B.dates.slice(i0,i1+1);
  const s2=SR2(B), sc2=s2?s2.slice(i0,i1+1):null;
  const s3=SR3(B), sc3=s3?s3.slice(i0,i1+1):null;
  const SWG = MODE==='swing';

  const W=Math.max(560,cvW), H=Math.max(340,Math.min(520,Math.round(W*0.36)));
  const PADX=32, L=62, RM=54, TOPY=H*0.075, BOTY=H*0.90;
  const PW=W-PADX*2-L-RM;

  /* y 轴：按窗口自适应；0 / 100 离数据不远时纳入，保留恐贪刻度感 */
  let lo=Math.min(...sc), hi=Math.max(...sc);
  if(sc2){ lo=Math.min(lo,Math.min(...sc2)); hi=Math.max(hi,Math.max(...sc2)); }
  if(sc3){ lo=Math.min(lo,Math.min(...sc3)); hi=Math.max(hi,Math.max(...sc3)); }
  const span=Math.max(hi-lo,10), pad=span*0.12;
  let yLo=lo-pad, yHi=hi+pad;
  if(0   >= lo-span) yLo=Math.min(yLo,0);
  if(100 <= hi+span) yHi=Math.max(yHi,100);
  const step=(yHi-yLo)>120?20:(yHi-yLo)>60?10:(yHi-yLo)>30?5:2;
  const yMin=Math.floor(yLo/step)*step, yMax=Math.ceil(yHi/step)*step;
  const y=v=>BOTY-(v-yMin)/(yMax-yMin)*(BOTY-TOPY);
  const x=a=>L+PW*(a-i0)/(N-1);               // a = 绝对索引

  let clo=Math.min(...cl), chi=Math.max(...cl);
  const yc=v=>BOTY-(v-clo)/(chi-clo||1)*(BOTY-TOPY);

  const P=[];
  const T0=THR();
  // 溢出区 / 超卖区
  if(SWG){
    // SWING：分值越低越超卖 → 阈值**以下**是入场区
    if(T0>yMin) P.push(`<rect x="${L}" y="${y(T0)}" width="${PW}" height="${BOTY-y(T0)}" fill="#3ECF8E" opacity=".09"/>`);
  }else{
    if(yMin<0) P.push(`<rect x="${L}" y="${y(0)}" width="${PW}" height="${BOTY-y(0)}" fill="#3ECF8E" opacity=".07"/>`);
    if(yMax>100) P.push(`<rect x="${L}" y="${TOPY}" width="${PW}" height="${y(100)-TOPY}" fill="#FF5C5C" opacity=".09"/>`);
  }
  // 网格 + y 轴刻度
  for(let v=Math.ceil(yMin/step)*step; v<=yMax+1e-9; v+=step){
    P.push(`<line x1="${L}" y1="${y(v)}" x2="${L+PW}" y2="${y(v)}" stroke="#1C2532" stroke-width="1"/>`);
    P.push(`<text x="${L-10}" y="${y(v)+4}" fill="#7A8AA1" font-size="12" text-anchor="end">${+v.toFixed(2)}</text>`);
  }
  P.push(`<line x1="${L}" y1="${BOTY}" x2="${L+PW}" y2="${BOTY}" stroke="#28323F" stroke-width="1"/>`);
  // 0 / 100 边界（SENTI-1 的绝对刻度）
  if(!SWG){
    [[0,'#3ECF8E','下'],[100,'#FF5C5C','上']].forEach(([v,c,dir])=>{
      if(v>=yMin&&v<=yMax)
        P.push(`<line x1="${L}" y1="${y(v)}" x2="${L+PW}" y2="${y(v)}" stroke="${c}" stroke-width="1.5" stroke-dasharray="6 4" opacity=".8"/>`);
      else
        P.push(`<text x="${L+6}" y="${v<yMin?BOTY-6:TOPY+13}" fill="${c}" font-size="10" opacity=".65">${v} 线在${dir}方（窗口外）</text>`);
    });
  }
  // 入场阈值线
  if(T0>=yMin&&T0<=yMax){
    const lab = SWG ? `入场阈值 ${T0}（≤ 即触发）` : `入场阈值 ${T0}`;
    P.push(`<line x1="${L}" y1="${y(T0)}" x2="${L+PW}" y2="${y(T0)}" stroke="#6FE39C"
             stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/>`);
    P.push(`<text x="${L+PW-4}" y="${y(T0)-5}" fill="#6FE39C" font-size="10"
             text-anchor="end" opacity=".85">${lab}</text>`);
  }
  // 指数收盘
  if(ovl){
    let d='';
    for(let a=i0;a<=i1;a++) d+=(a>i0?'L':'M')+x(a).toFixed(1)+' '+yc(cl[a-i0]).toFixed(1);
    P.push(`<path d="${d}" fill="none" stroke="#5C6E85" stroke-width="1.4" opacity=".8"/>`);
    P.push(`<text x="${L+PW+8}" y="${yc(chi)+4}" fill="#7286A0" font-size="12">${Math.round(chi)}</text>`);
    P.push(`<text x="${L+PW+8}" y="${yc(clo)+4}" fill="#7286A0" font-size="12">${Math.round(clo)}</text>`);
  }
  // 面积 + 主线
  let d='',a2=`M${L} ${BOTY} `;
  for(let a=i0;a<=i1;a++){const s=x(a).toFixed(1)+' '+y(sc[a-i0]).toFixed(1);d+=(a>i0?'L':'M')+s;a2+=`L${s} `;}
  a2+=`L${L+PW} ${BOTY} Z`;
  P.push(`<defs><linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0%" stop-color="#5FA8FF" stop-opacity=".30"/>
    <stop offset="100%" stop-color="#5FA8FF" stop-opacity="0"/></linearGradient></defs>`);
  P.push(`<path d="${a2}" fill="url(#g1)"/>`);
  P.push(`<path d="${d}" fill="none" stroke="#5FA8FF" stroke-width="2" stroke-linejoin="round"/>`);
  // 合并视图：叠加 SWING-2 曲线（虚线）+ 它自己的阈值线
  if(sc2){
    let d2='';
    for(let a=i0;a<=i1;a++) d2+=(a>i0?'L':'M')+x(a).toFixed(1)+' '+y(sc2[a-i0]).toFixed(1);
    P.push(`<path d="${d2}" fill="none" stroke="#C9A2FF" stroke-width="1.6"
             stroke-dasharray="5 4" opacity=".85" stroke-linejoin="round"/>`);
    const T1=THR2();
    if(T1!=null&&T1>=yMin&&T1<=yMax){
      P.push(`<line x1="${L}" y1="${y(T1)}" x2="${L+PW}" y2="${y(T1)}" stroke="#C9A2FF"
               stroke-width="1.1" stroke-dasharray="3 4" opacity=".6"/>`);
      P.push(`<text x="${L+PW-4}" y="${y(T1)+12}" fill="#C9A2FF" font-size="10"
               text-anchor="end" opacity=".85">SWING-2 阈值 ${T1}</text>`);
    }
  }
  // 合并视图：再叠加 SWING-3 曲线（点线）+ 它的阈值线
  if(sc3){
    let d3='';
    for(let a=i0;a<=i1;a++) d3+=(a>i0?'L':'M')+x(a).toFixed(1)+' '+y(sc3[a-i0]).toFixed(1);
    P.push(`<path d="${d3}" fill="none" stroke="#FFB86B" stroke-width="1.5"
             stroke-dasharray="1.5 3.5" opacity=".85" stroke-linejoin="round"/>`);
    const T2=THR3();
    if(T2!=null&&T2>=yMin&&T2<=yMax){
      P.push(`<line x1="${L}" y1="${y(T2)}" x2="${L+PW}" y2="${y(T2)}" stroke="#FFB86B"
               stroke-width="1.1" stroke-dasharray="3 4" opacity=".6"/>`);
      P.push(`<text x="${L+6}" y="${y(T2)-5}" fill="#FFB86B" font-size="10"
               opacity=".85">SWING-3 阈值 ${T2}（须回升）</text>`);
    }
  }
  // 信号点：一律是「低点买入」信号，画在曲线下方；样式 = 置信等级
  // （A 实心+光环 / B 实心 / C 空心。顶部信号已移除，不再有方向之分）
  const evs=EVS(B);
  evs.forEach(e=>{
    const a=B.dates.indexOf(e.date); if(a<i0||a>i1) return;
    const g=gradeOf(e), col=GCOL[g]||GCOL.C;
    /* 合并视图下，各信号点挂到各自模型的曲线上（回调底→主曲线 / 动量拐点→SWING-2 / 均线拐点→SWING-3） */
    const useS=(sc2&&e.src==='macd')?sc2:((sc3&&e.src==='maslope')?sc3:sc);
    const cx=x(a).toFixed(1), cyy=y(useS[a-i0]), cyc=cyy+12;
    P.push(`<line x1="${cx}" y1="${cyy.toFixed(1)}" x2="${cx}" y2="${cyc.toFixed(1)}"
             stroke="${col}" stroke-width="1" opacity=".5"/>`);
    if(g==='A')
      P.push(`<circle cx="${cx}" cy="${cyc.toFixed(1)}" r="9.5" fill="none"
               stroke="${col}" stroke-width="1.4" opacity=".9"/>`);
    const fill=g==='C'?'none':col, sw=g==='C'?1.8:1.2;
    if(sc2&&e.src==='macd')
      P.push(`<path d="M${cx} ${(cyc-7).toFixed(1)} l6.5 7 l-6.5 7 l-6.5 -7 Z"
               fill="${fill}" stroke="${col}" stroke-width="${sw}" stroke-linejoin="round"/>`);
    else if(sc3&&e.src==='maslope')
      P.push(`<circle cx="${cx}" cy="${cyc.toFixed(1)}" r="5.5"
               fill="${fill}" stroke="${col}" stroke-width="${sw}"/>`);
    else{
      const ap=(cyc-8).toFixed(1), bs=(cyc+5).toFixed(1);
      P.push(`<path d="M${cx} ${ap} l-6.5 ${(bs-ap)} l13 0 Z"
               fill="${fill}" stroke="${col}" stroke-width="${sw}" stroke-linejoin="round"/>`);
    }
  });
  // 最新点标注（与左侧卡片同源，避免"对不上"）
  const lx=x(i1), ly=y(sc[N-1]);
  P.push(`<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.5" fill="#5FA8FF" stroke="#0E131A" stroke-width="2"/>`);
  P.push(`<text x="${(lx-8).toFixed(1)}" y="${(ly-11).toFixed(1)}" fill="#8FC3FF"
           font-size="12" font-weight="700" text-anchor="end">${fmt(sc[N-1],1)}</text>`);
  // 时间轴
  const nT=Math.min(6,N);
  for(let k=0;k<nT;k++){
    const a=i0+Math.round(k*(N-1)/(nT-1));
    const lab = N<=70 ? dt[a-i0].slice(5) : dt[a-i0].slice(0,7);
    P.push(`<text x="${x(a).toFixed(1)}" y="${BOTY+22}" fill="#7A8AA1" font-size="12" text-anchor="middle">${lab}</text>`);
  }
  // 命中提示
  P.push(`<rect id="hover" width="1" height="${BOTY-TOPY}" y="${TOPY}" fill="#5FA8FF" opacity=".25" style="display:none"/>`);
  P.push(`<circle id="hdot" r="4.5" fill="#fff" style="display:none"/>`);

  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block">${P.join('')}</svg>`;
  const evmap={};
  EVS(B).forEach(e=>{(evmap[e.date]=evmap[e.date]||[]).push(e);});
  el._geo={x,y,sc,sc2,sc3,close:cl,dates:dt,i0,N,W,H,L,PW,TOPY,BOTY,evmap,hold:HOLD};

  const svg=el.querySelector('svg');
  svg.addEventListener('mousemove',ev=>{
    const g=el._geo, r=svg.getBoundingClientRect();
    const px=(ev.clientX-r.left)/r.width*g.W;
    let i=Math.round((px-g.L)/(g.PW/(g.N-1)));
    i=Math.max(0,Math.min(g.N-1,i));
    const hx=g.x(g.i0+i);
    const hv=document.getElementById('hover'),hd=document.getElementById('hdot');
    hv.setAttribute('x',hx);hv.style.display='';
    hd.setAttribute('cx',hx);hd.setAttribute('cy',g.y(g.sc[i]));hd.style.display='';
    const tip=document.getElementById('tip');
    tip.style.display='block';tip.style.left=(ev.clientX+14)+'px';tip.style.top=(ev.clientY-10)+'px';
    const evs2=g.evmap[g.dates[i]]||[];
    const evTxt=evs2.map(e=>{
      const gg=gradeOf(e);
      const nm=(MODE==='swing'?'小波段低点信号':'底部信号');
      const rr=(e.ret!=null?`　T+${g.hold||20} ${e.ret>0?'+':''}${fmt(e.ret)}%`
                           :'　待验证');
      const stag = (MODE==='swing'&&SRC==='union')
        ? (e.src==='macd' ? '<span style="color:#C9A2FF">◆动量拐点</span> '
           : e.src==='maslope' ? '<span style="color:#FFB86B">●均线拐点</span> '
           : e.src==='swing' ? '<span style="color:#5FA8FF">▲回调底</span> '
           : '<span style="color:#F5B544">多模型同时</span> ')
        : '';
      return `<div style="margin-top:4px">${stag}<b style="color:${GCOL[gg]}">${gg} 级</b> ${nm}
              · ${whyOf(e,gg)}${rr}</div>`;
    }).join('');
    const lbl = MODE!=='swing' ? `情绪分值 <b>${fmt(g.sc[i],1)}</b>`
      : SRC==='union'  ? `回调底 <b>${fmt(g.sc[i],1)}</b>　`
                        +`动量拐点 <b style="color:#C9A2FF">${fmt((g.sc2||[])[i],1)}</b>　`
                        +`均线拐点 <b style="color:#FFB86B">${fmt((g.sc3||[])[i],1)}</b>`
      : SRC==='swing2' ? `动量拐点 <b>${fmt(g.sc[i],1)}</b>`
      : SRC==='swing3' ? `均线拐点 <b>${fmt(g.sc[i],1)}</b>（越低＝均线跌得越急）`
      : `SWING 超卖度 <b>${fmt(g.sc[i],1)}</b>`;
    tip.innerHTML=`<b>${g.dates[i]}</b><br>` + lbl
      + `<br>指数 ${g.close[i]}` + evTxt;
  });
  svg.addEventListener('mouseleave',()=>{
    document.getElementById('hover').style.display='none';
    document.getElementById('hdot').style.display='none';
    document.getElementById('tip').style.display='none';
  });

  // 窗口信息（图上画的就是原始分值，与左侧卡片同一个值）
  const ri=document.getElementById('rnginfo');
  if(ri) ri.innerHTML=`${dt[0]} ~ ${dt[N-1]}　·　${N} 个交易日　·　最新 `
    +`<b style="color:#9CC7FF">${fmt(SR(B)[i1],1)}</b>`
    +`（与左侧卡片同一个值）`;
}

/* ---------- 图例 / 等级说明（随模式切换） ---------- */
const LEGEND_SENTI =
  `<span><i style="background:var(--blu)"></i>情绪分值</span>
   <span><i style="background:#5C6E85"></i>指数收盘（右轴）</span>
   <span><i style="background:var(--grn)"></i>&lt;0 底部溢出区</span>
   <span><i style="background:#6FE39C"></i>入场阈值线</span>
   <span><i style="background:var(--red)"></i>&gt;100 过热区（不出信号）</span>
   <span><i style="background:var(--yel)"></i>信号点</span>
   <span style="white-space:nowrap">等级：
     <b style="color:#6FE39C">▲</b>A 高置信（实心+光环）　
     <b style="color:#F5B544">▲</b>B 中（实心）　
     <b style="color:#96A5BA">△</b>C 低（空心）</span>`;
/* 单模型视图：曲线说明随 SRC 变，等级说明是通用的（不写死某个模型的百分比） */
const LEGEND_ONE_HEAD = {
  swing:  `<span><i style="background:var(--blu)"></i>回调底 SWING 超卖度（越低越超卖）</span>`,
  swing2: `<span><i style="background:#C9A2FF"></i>动量拐点 SWING-2：MACD 柱／收盘价（越低越超卖）</span>`,
  swing3: `<span><i style="background:#FFB86B"></i>均线拐点 SWING-3：MA20 斜率（越低＝均线跌得越急，且须回升）</span>`,
};
const LEGEND_ONE_TAIL =
  `<span><i style="background:#5C6E85"></i>指数收盘（右轴）</span>
   <span><i style="background:var(--grn)"></i>≤ 阈值 入场区</span>
   <span><i style="background:#6FE39C"></i>入场阈值线</span>
   <span><i style="background:var(--yel)"></i>信号点</span>
   <span style="white-space:nowrap">等级＝当天共振板块数：
     <b style="color:#4FD1E8">▲</b>S ≥5　
     <b style="color:#6FE39C">▲</b>A ≥4　
     <b style="color:#F5B544">▲</b>B 2~3　
     <b style="color:#96A5BA">△</b>C 仅自身</span>`;
const LEGEND_UNION =
  `<span><i style="background:var(--blu)"></i>回调底＝跌到哪了（SWING 实线，≤22 触发）</span>
   <span><i style="background:#C9A2FF"></i>动量拐点＝跌得多快（SWING-2 虚线）</span>
   <span><i style="background:#FFB86B"></i>均线拐点＝均线还跌得多急（SWING-3 点线，≤10 且须回升）</span>
   <span><i style="background:#5C6E85"></i>指数收盘（右轴）</span>
   <span><i style="background:var(--grn)"></i>≤ 阈值 入场区</span>
   <span><i style="background:var(--yel)"></i>▲＝回调底　◆＝动量拐点　●＝均线拐点</span>
   <span style="white-space:nowrap">等级＝当天有几个板块出信号（并集口径）：
     <b style="color:#4FD1E8">▲</b>S ≥5　
     <b style="color:#6FE39C">▲</b>A ≥4　
     <b style="color:#F5B544">▲</b>B 2~3　
     <b style="color:#96A5BA">△</b>C 仅自身</span>`;

function renderMeta(){
  const SWG=MODE==='swing', sw=SW();
  document.getElementById('legend').innerHTML =
    !SWG ? LEGEND_SENTI
         : (SRC==='union' ? LEGEND_UNION
            : (LEGEND_ONE_HEAD[SRC]||LEGEND_ONE_HEAD.swing)+LEGEND_ONE_TAIL);
  document.getElementById('gsum').textContent =
    SWG?'等级说明：共振强弱怎么看':'等级说明：A / B / C 怎么用';
  document.getElementById('gbody').innerHTML = SWG
    ? `<b class="k">三个小波段模型各看一个维度</b>，信号几乎不重叠，合并起来信号最多：
         <b style="color:#5FA8FF">回调底</b>看「跌到哪了」、
         <b style="color:#C9A2FF">动量拐点</b>看「跌得还有多快」、
         <b style="color:#FFB86B">均线拐点</b>看「均线还跌得多急，且当天已经回升」。
         近 3 年 6 板块：三个合并 <b class="k">189 次信号 / 命中 70.9%</b>（基线 48.6%），
         比只用前两个（143 次 / 66.4%）<b class="k">信号多 32%、命中高 4.5 个点</b>。
         <br><b class="k">⚠️ 信号次数 ≠ 事件次数</b>：同一波下跌里三个模型往往隔几天各触发一次，
         只按同日去重会重复计数。按「同板块 ±4 自然日算一件事、只算第一枪」合并后，
         189 次信号实际是 <b class="k">136 件事 / 命中 67.6%</b>（Wilson 下界 59.4%）。
         上方的信号源切换条会同时给出两个数。
         <br><b class="k">等级＝当天有几个板块一起出信号</b>（含自己）。共振越强＝越像系统性回调，
         而不是这一个板块自己的问题。实测命中率随共振单调上升
         （以 SWING 为例，近 3 年 / 含 2021-22 熊市的 5.7 年）：
         <b style="color:#4FD1E8">S</b>（≥5）81% / <b class="k">87%</b>、
         <b style="color:#6FE39C">A</b>（4）78% / 79%、
         <b style="color:#F5B544">B</b>（2~3）63% / 57%、
         <b style="color:#96A5BA">C</b>（只有自己）＝全样本平均 64% / 60%。
         <br><b class="k">重要</b>：共振等级<b class="k">不决定出不出信号</b>，只用来定仓位。
         科创板 2026-08-03 是 B 级、2026-09-14 是 C 级 —— 它们仍会被标出来，
         只是证据强度不如 S/A 级。
         <br><b class="k">别把 S 级的数字当成全部信号的能力</b>：全部信号 64%，S 级 87%，
         S 级一年只有 3~5 次。
         <br>判定口径：T+${sw.hold} 期末收益 &gt; 0 且期间最深回撤 ≥ −${sw.tol}%，
         随机基线约 <b class="k">${(SUM.swing&&SUM.swing.total)?SUM.swing.total.base:'—'}%</b>。`
    : `<b class="k">等级有什么用</b>：等级<b class="k">不决定出不出信号</b>，它回答的是
         「这次信号有几个独立证据支持」，只用来<b class="k">定仓位</b> ——
         <b style="color:#6FE39C">A</b>：两个确认层都成立（估值已投降 ＋ 多板块共振）→ 证据最足，可正常甚至偏重；
         <b style="color:#F5B544">B</b>：只成立一个 → 常规仓位；
         <b style="color:#96A5BA">C</b>：两个都没成立 → 置信度回落到全样本平均，建议减半或观望。
         <br>两个确认层：<b class="k">估值投降</b>＝破净股占比处于近一年高分位（市场级，管时机）；
         <b class="k">全场共振</b>＝同一天还有别的板块也跌到 ≤0（横截面，管选谁）。
         近 3 年：<b class="k">A 级 3 个（3/3 命中）、B 级 16 个（14/16）、C 级 0 个</b>。
         <br><b style="color:#FF5C5C">顶部信号已移除</b>：原「首破 100」信号实测 2/9 = 22%，
         随机基线 40%，p = 0.93，与瞎猜无法区分，所以不再产出任何顶部提示；
         分值 &gt;100 仍然照画，但只是过热读数，<b class="k">不是卖出信号</b>。`;

  // 当前模式的实测命中率（放在图表上方，跟着模式走）
  const ms=document.getElementById('modestat');
  if(ms){
    if(SWG){
      const t = SRC==='union'  ? ((SUM.union&&SUM.union.total)||{})
              : SRC==='swing2' ? ((SUM.swing2&&SUM.swing2.total)||{})
              : SRC==='swing3' ? ((SUM.swing3&&SUM.swing3.total)||{})
              : ((SUM.swing&&SUM.swing.total)||{});
      const r5=t.res5_n?Math.round(t.res5_ok/t.res5_n*100):null;
      const r4=t.res4_n?Math.round(t.res4_ok/t.res4_n*100):null;
      ms.innerHTML = `实测（近3年·6板块）　全部 <b>${t.rate??'—'}%</b>（${t.ok??0}/${t.n??0}）`
        + (r5!=null?`　·　S级≥5 <b>${r5}%</b>（${t.res5_ok}/${t.res5_n}）`:'')
        + (r4!=null?`　·　A级≥4 <b>${r4}%</b>（${t.res4_ok}/${t.res4_n}）`:'')
        + `　·　基线 ${t.base??'—'}%`;
    }else{
      const t=SUM.total||{};
      ms.innerHTML = `实测（近3年·6板块）　底部 <b>${t.b_n?Math.round(t.b_ok/t.b_n*100):'—'}%</b>`
        + `（${t.b_ok??0}/${t.b_n??0}）　·　基线 ${(SUM.per&&SUM.per[cur])?SUM.per[cur].base_bottom:'—'}%`;
    }
  }
}


/* ---------- render ---------- */
function render(){
  const B=DATA[cur], S=SR(B);
  const v=S[S.length-1];
  const [txt,col]=state(v);
  document.getElementById('bname').textContent=B.name+'　'+B.desc;
  const sv=document.getElementById('sval'); sv.textContent=fmt(v,1); sv.style.color=col;
  document.getElementById('stag').innerHTML=`<span class="tag" style="background:${col}22;color:${col};border:1px solid ${col}66">${txt}</span>`;
  const prev=S[S.length-6]??S[0];
  document.getElementById('schg').innerHTML=
    `<div>截至 ${B.dates[B.dates.length-1]}　较5日前 <b style="color:${v>=prev?'var(--red)':'var(--grn)'}">${v-prev>=0?'+':''}${fmt(v-prev,1)}</b></div>
     <div>指数 ${B.close[B.close.length-1]}（${((B.close[B.close.length-1]/B.close[0]-1)*100).toFixed(1)}% / 3年）</div>`;
  // 刻度条：SENTI-1 是 −30~140 的绝对刻度，SWING 是 0~100 的超卖度
  const SWG=MODE==='swing', T0=THR();
  document.getElementById('barscale').innerHTML = SWG
    ? `<span style="left:0%">0</span><span style="left:${T0}%">${T0}</span>`
      + `<span style="left:60%">60</span><span style="left:100%">100</span>`
    : `<span style="left:0%">-30</span><span style="left:18.75%">0</span>`
      + `<span style="left:81.25%">100</span><span style="left:100%">140</span>`;
  document.getElementById('barlab').innerHTML = SWG
    ? '<span>超卖（入场区）</span><span>过热</span>'
    : '<span>恐慌</span><span>贪婪</span>';
  document.getElementById('mk').style.left =
    (SWG ? Math.max(0,Math.min(100,v)) : Math.max(0,Math.min(100,(v+30)/160*100)))+'%';
  drawChart();

  // 最近一次信号（信号表已移除，这里保留最关键的回溯信息）
  const lastSig=EVS(B).slice().sort((p,q)=>p.date<q.date?1:-1)[0];
  const lsEl=document.getElementById('lsig');
  if(lsEl){
    const g0=lastSig?gradeOf(lastSig):'C';
    lsEl.innerHTML = lastSig
      ? `最近信号　<b style="color:${GCOL[g0]}">${g0} 级</b>
         ${SWG?'小波段低点':'底部'}　${lastSig.date}
         　${whyOf(lastSig,g0)}　T+${HOLD2()}
         ${lastSig.ret!=null
           ? `<b class="${lastSig.ret>0?'up':'dn'}">${lastSig.ret>0?'+':''}${fmt(lastSig.ret)}%</b>`
           : '<b style="color:var(--yel)">待验证</b>'}`
      : '<span style="color:var(--dim)">近3年无信号</span>';
  }
  renderMeta();
}

document.getElementById('ovl').onchange=drawChart;
window.addEventListener('resize',()=>{measure();drawChart();});
syncSrc(); measure(); render();
</script>
